<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>音乐 - 佳景</title>
    
    <!-- PWA Meta 标签 -->
    <meta name="theme-color" content="#FFF8DC">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <!-- 平方长安体字体 -->
    <link href="https://fontsapi.zeoseven.com/492/main/result.css" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: '平方长安体', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #FFFEF0 0%, #FFF8DC 50%, #FFF5D4 100%);
            min-height: 100vh;
            color: #5C4A3A;
            overflow-x: hidden;
        }
        
        /* 顶部状态栏占位 */
        .status-bar-placeholder {
            height: env(safe-area-inset-top, 44px);
            min-height: 44px;
            background: transparent;
        }
        
        /* 顶部导航栏 */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 254, 240, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 10px 16px;
            border-bottom: 1px solid rgba(210, 180, 140, 0.2);
        }
        
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        
        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(210, 180, 140, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .back-btn:hover {
            background: rgba(210, 180, 140, 0.4);
            transform: scale(1.05);
        }
        
        .back-btn svg {
            width: 20px;
            height: 20px;
            stroke: #8B7355;
        }
        
        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: #6B5344;
            letter-spacing: 2px;
        }
        
        .header-actions {
            display: flex;
            gap: 8px;
        }
        
        .header-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(210, 180, 140, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .header-btn:hover {
            background: rgba(210, 180, 140, 0.4);
        }
        
        .header-btn svg {
            width: 18px;
            height: 18px;
            stroke: #8B7355;
        }
        
        /* 搜索框 */
        .search-container {
            position: relative;
            margin-bottom: 8px;
        }
        
        .search-box {
            width: 100%;
            height: 44px;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(210, 180, 140, 0.3);
            border-radius: 22px;
            padding: 0 48px 0 44px;
            font-size: 15px;
            color: #5C4A3A;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        
        .search-box::placeholder {
            color: #B8A080;
        }
        
        .search-box:focus {
            border-color: #D4A574;
            box-shadow: 0 0 0 3px rgba(212, 165, 116, 0.2);
        }
        
        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            stroke: #B8A080;
        }
        
        .search-btn {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #D4A574 0%, #C49A6C 100%);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .search-btn:hover {
            transform: translateY(-50%) scale(1.05);
            box-shadow: 0 4px 12px rgba(212, 165, 116, 0.4);
        }
        
        .search-btn svg {
            width: 16px;
            height: 16px;
            stroke: white;
        }
        
        /* 轮播图区域 */
        .carousel-section {
            padding: 16px;
        }
        
        .carousel-container {
            position: relative;
            width: 100%;
            height: 180px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(139, 115, 85, 0.15);
            border: 3px solid rgba(210, 180, 140, 0.4);
            background: linear-gradient(135deg, #FFF5E6 0%, #FFE4C4 100%);
        }
        
        .carousel-slides {
            display: flex;
            transition: transform 0.5s ease;
            height: 100%;
        }
        
        .carousel-slide {
            min-width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .carousel-slide video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .carousel-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #B8A080;
            font-size: 14px;
        }
        
        .carousel-placeholder svg {
            width: 48px;
            height: 48px;
            stroke: #D4A574;
            margin-bottom: 8px;
        }
        
        .carousel-dots {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
        }
        
        .carousel-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .carousel-dot.active {
            width: 24px;
            border-radius: 4px;
            background: white;
        }
        
        .carousel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: all 0.3s ease;
        }
        
        .carousel-container:hover .carousel-nav {
            opacity: 1;
        }
        
        .carousel-nav.prev {
            left: 12px;
        }
        
        .carousel-nav.next {
            right: 12px;
        }
        
        .carousel-nav svg {
            width: 16px;
            height: 16px;
            stroke: #8B7355;
        }
        
        /* 歌单区域 */
        .playlist-section {
            padding: 0 16px 120px;
        }
        
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #6B5344;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(180deg, #D4A574 0%, #C49A6C 100%);
            border-radius: 2px;
        }
        
        .section-actions {
            display: flex;
            gap: 8px;
        }
        
        .section-btn {
            padding: 6px 14px;
            border-radius: 16px;
            border: 1px solid rgba(210, 180, 140, 0.4);
            background: rgba(255, 255, 255, 0.6);
            color: #8B7355;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        
        .section-btn:hover {
            background: rgba(212, 165, 116, 0.2);
            border-color: #D4A574;
        }
        
        .section-btn.primary {
            background: linear-gradient(135deg, #D4A574 0%, #C49A6C 100%);
            color: white;
            border: none;
        }
        
        .section-btn.primary:hover {
            box-shadow: 0 4px 12px rgba(212, 165, 116, 0.4);
        }
        
        /* 歌单标签 */
        .playlist-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        
        .playlist-tabs::-webkit-scrollbar {
            display: none;
        }
        
        .playlist-tab {
            padding: 8px 18px;
            border-radius: 20px;
            border: 2px solid rgba(210, 180, 140, 0.3);
            background: rgba(255, 255, 255, 0.5);
            color: #8B7355;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            font-family: inherit;
        }
        
        .playlist-tab:hover {
            border-color: #D4A574;
            background: rgba(212, 165, 116, 0.1);
        }
        
        .playlist-tab.active {
            background: linear-gradient(135deg, #D4A574 0%, #C49A6C 100%);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(212, 165, 116, 0.3);
        }
        
        /* 歌曲列表 */
        .songs-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .song-item {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 14px;
            border: 1px solid rgba(210, 180, 140, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .song-item:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateX(4px);
            box-shadow: 0 4px 16px rgba(139, 115, 85, 0.1);
        }
        
        .song-item.playing {
            background: linear-gradient(135deg, rgba(212, 165, 116, 0.15) 0%, rgba(196, 154, 108, 0.1) 100%);
            border-color: rgba(212, 165, 116, 0.4);
        }
        
        .song-number {
            width: 32px;
            text-align: center;
            font-size: 14px;
            color: #B8A080;
            font-weight: 500;
        }
        
        .song-item.playing .song-number {
            color: #D4A574;
        }
        
        .song-cover {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: linear-gradient(135deg, #FFE4C4 0%, #DEB887 100%);
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        
        .song-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .song-cover svg {
            width: 24px;
            height: 24px;
            stroke: #8B7355;
        }
        
        .song-info {
            flex: 1;
            min-width: 0;
        }
        
        .song-name {
            font-size: 15px;
            font-weight: 500;
            color: #5C4A3A;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }
        
        .song-artist {
            font-size: 12px;
            color: #999;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .song-duration {
            font-size: 13px;
            color: #B8A080;
            margin-right: 12px;
        }
        
        .song-actions {
            display: flex;
            gap: 8px;
        }
        
        .song-action-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .song-action-btn:hover {
            background: rgba(210, 180, 140, 0.2);
        }
        
        .song-action-btn svg {
            width: 18px;
            height: 18px;
            stroke: #8B7355;
        }
        
        /* 底部播放器 */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 254, 240, 0.98);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(210, 180, 140, 0.3);
            padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px));
            z-index: 200;
            transform: translateY(0);
            transition: transform 0.3s ease;
        }
        
        .player-bar.hidden {
            transform: translateY(100%);
        }
        
        .player-bar-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .player-cover {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: linear-gradient(135deg, #FFE4C4 0%, #DEB887 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
        }
        
        .player-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .player-cover svg {
            width: 24px;
            height: 24px;
            stroke: #8B7355;
        }
        
        .player-info {
            flex: 1;
            min-width: 0;
            cursor: pointer;
        }
        
        .player-song-name {
            font-size: 14px;
            font-weight: 500;
            color: #5C4A3A;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }
        
        .player-artist {
            font-size: 12px;
            color: #999;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .player-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .player-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .player-btn:hover {
            background: rgba(210, 180, 140, 0.2);
        }
        
        .player-btn svg {
            width: 20px;
            height: 20px;
            stroke: #8B7355;
            fill: none;
        }
        
        .player-btn.play {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #D4A574 0%, #C49A6C 100%);
        }
        
        .player-btn.play svg {
            stroke: white;
            fill: white;
        }
        
        .player-btn.play:hover {
            box-shadow: 0 4px 12px rgba(212, 165, 116, 0.4);
            transform: scale(1.05);
        }
        
        .player-progress {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(210, 180, 140, 0.3);
        }
        
        .player-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #D4A574 0%, #C49A6C 100%);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        /* 全屏播放器 */
        .fullscreen-player {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #FFFEF0 0%, #FFF8DC 50%, #FFE4C4 100%);
            z-index: 1000;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        
        .fullscreen-player.show {
            display: flex;
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .fullscreen-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            padding-top: calc(16px + env(safe-area-inset-top, 0px));
        }
        
        .fullscreen-back {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(210, 180, 140, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .fullscreen-back:hover {
            background: rgba(210, 180, 140, 0.4);
        }
        
        .fullscreen-back svg {
            width: 20px;
            height: 20px;
            stroke: #8B7355;
        }
        
        .fullscreen-title {
            font-size: 16px;
            font-weight: 600;
            color: #6B5344;
        }
        
        .fullscreen-more {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(210, 180, 140, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        .fullscreen-more svg {
            width: 20px;
            height: 20px;
            stroke: #8B7355;
        }
        
        .fullscreen-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .fullscreen-cover {
            width: min(60vw, 280px);
            height: min(60vw, 280px);
            max-width: 280px;
            max-height: 280px;
            border-radius: 20px;
            background: linear-gradient(135deg, #FFE4C4 0%, #DEB887 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(139, 115, 85, 0.3);
            margin-bottom: 30px;
            flex-shrink: 0;
        }
        
        .fullscreen-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .fullscreen-cover svg {
            width: 80px;
            height: 80px;
            stroke: #8B7355;
        }
        
        .fullscreen-song-info {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .fullscreen-song-name {
            font-size: 22px;
            font-weight: 600;
            color: #5C4A3A;
            margin-bottom: 8px;
        }
        
        .fullscreen-artist {
            font-size: 15px;
            color: #999;
        }
        
        /* 歌词区域 */
        .lyrics-container {
            width: 100%;
            max-width: 400px;
            height: min(20vh, 120px);
            max-height: 120px;
            overflow: hidden;
            position: relative;
            margin-bottom: 20px;
            flex-shrink: 1;
        }
        
        .lyrics-list {
            text-align: center;
            transition: transform 0.3s ease;
        }
        
        .lyric-line {
            font-size: 14px;
            color: #999;
            padding: 8px 0;
            transition: all 0.3s ease;
            opacity: 0.6;
        }
        
        .lyric-line.active {
            font-size: 16px;
            color: #D4A574;
            opacity: 1;
            font-weight: 500;
        }
        
        /* 进度条 */
        .fullscreen-progress {
            width: 100%;
            max-width: 400px;
            margin-bottom: 8px;
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(210, 180, 140, 0.3);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }
        
        .progress-current {
            height: 100%;
            background: linear-gradient(90deg, #D4A574 0%, #C49A6C 100%);
            border-radius: 2px;
            position: relative;
            width: 0%;
            transition: width 0.1s linear;
        }
        
        .progress-current::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        
        .progress-time {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #999;
            margin-top: 8px;
        }
        
        /* 全屏控制按钮 */
        .fullscreen-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: min(5vw, 24px);
            margin-top: 15px;
            flex-shrink: 0;
            padding-bottom: 20px;
        }
        
        .fullscreen-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .fullscreen-btn:hover {
            background: rgba(210, 180, 140, 0.2);
        }
        
        .fullscreen-btn svg {
            width: 24px;
            height: 24px;
            stroke: #8B7355;
            fill: none;
        }
        
        .fullscreen-btn.play {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #D4A574 0%, #C49A6C 100%);
        }
        
        .fullscreen-btn.play svg {
            width: 28px;
            height: 28px;
            stroke: white;
            fill: white;
        }
        
        .fullscreen-btn.play:hover {
            box-shadow: 0 6px 20px rgba(212, 165, 116, 0.4);
            transform: scale(1.05);
        }
        
        /* 空状态 */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: #B8A080;
        }
        
        .empty-state svg {
            width: 80px;
            height: 80px;
            stroke: #D4A574;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        
        .empty-state-text {
            font-size: 15px;
            margin-bottom: 8px;
        }
        
        .empty-state-hint {
            font-size: 13px;
            opacity: 0.7;
        }
        
        /* 创建歌单弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .modal-overlay.show {
            display: flex;
        }
        
        .modal-content {

    <script>
        // 【方案 C】调试按钮显示开关
        // 显示条件（满足任一即可）：
        //   1) URL 带 ?debug=1（会写入 localStorage，之后不带参数也显示）
        //   2) ?debug=0 关闭
        //   3) 本地开发环境（localhost / 127.0.0.1 / file://）
        (function () {
            var STORAGE_KEY = 'app_debug_enabled';
            var btn = document.getElementById('debugBtn');
            if (!btn) return;

            function readFlag() {
                try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
            }
            function writeFlag(value) {
                try {
                    if (value === null) { localStorage.removeItem(STORAGE_KEY); }
                    else { localStorage.setItem(STORAGE_KEY, value); }
                } catch (e) { /* 隐私模式或受限 WebView，忽略 */ }
            }

            var match = /[?&]debug=([^&#]*)/.exec(location.search);
            var param = match ? decodeURIComponent(match[1]).toLowerCase() : null;
            if (param === '1' || param === 'true') { writeFlag('1'); }
            else if (param === '0' || param === 'false') { writeFlag('0'); }

            var stored = readFlag();
            var isLocalDev = location.protocol === 'file:' ||
                location.hostname === 'localhost' ||
                location.hostname === '127.0.0.1';

            if (stored === '1' || (stored !== '0' && isLocalDev)) {
                btn.style.display = 'flex';
            }
        })();
    </script>

    <script>
        // ==================== IndexedDB 存储 ====================
        const DB_NAME = 'MusicDB';
        const DB_VERSION = 2;
        let db = null;
        
        // 初始化 IndexedDB
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                
                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    resolve(db);
                };
                
                request.onupgradeneeded = (event) => {
                    const database = event.target.result;
                    
                    // 创建歌单存储
                    if (!database.objectStoreNames.contains('playlists')) {
                        database.createObjectStore('playlists', { keyPath: 'id' });
                    }
                    
                    // 创建搜索历史存储
                    if (!database.objectStoreNames.contains('searchHistory')) {
                        database.createObjectStore('searchHistory', { keyPath: 'id' });
                    }
                    
                    // 创建轮播图存储
                    if (!database.objectStoreNames.contains('carousel')) {
                        database.createObjectStore('carousel', { keyPath: 'id' });
                    }
                    
                    // 创建设置存储
                    if (!database.objectStoreNames.contains('settings')) {
                        database.createObjectStore('settings', { keyPath: 'id' });
                    }
                };
            });
        }
        
        // 保存数据到 IndexedDB
        function saveToDB(storeName, id, data) {
            return new Promise((resolve, reject) => {
                if (!db) {
                    reject(new Error('Database not initialized'));
                    return;
                }
                
                const transaction = db.transaction([storeName], 'readwrite');
                const store = transaction.objectStore(storeName);
                const request = store.put({ id, data, timestamp: Date.now() });
                
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }
        
        // 从 IndexedDB 获取数据
        function getFromDB(storeName, id) {
            return new Promise((resolve, reject) => {
                if (!db) {
                    resolve(null);
                    return;
                }
                
                const transaction = db.transaction([storeName], 'readonly');
                const store = transaction.objectStore(storeName);
                const request = store.get(id);
                
                request.onsuccess = () => {
                    const result = request.result;
                    resolve(result ? result.data : null);
                };
                request.onerror = () => reject(request.error);
            });
        }
        
        // 从 IndexedDB 删除数据
        function removeFromDB(storeName, id) {
            return new Promise((resolve, reject) => {
                if (!db) {
                    resolve();
                    return;
                }
                
                const transaction = db.transaction([storeName], 'readwrite');
                const store = transaction.objectStore(storeName);
                const request = store.delete(id);
                
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);

        // 检测是否在 Android APP 环境中
        function isAndroidApp() {
            return typeof AndroidInterface !== 'undefined' && AndroidInterface.httpGet;
        }
        
        // 通用 HTTP GET 请求（自动选择使用 fetch 或原生接口）
        function httpGet(url, apiKey = '') {
            return new Promise((resolve, reject) => {
                if (isAndroidApp()) {
                    // 使用 Android 原生 HTTP 接口
                    addDebugLog('使用 Android 原生 HTTP 接口', 'info');
                    addDebugLog(`请求 URL: ${url.substring(0, 100)}...`, 'info');
                    
                    const callbackName = 'httpCallback_' + Date.now();
                    addDebugLog(`回调函数名: ${callbackName}`, 'info');
                    
                    // 创建全局回调函数
                    window[callbackName] = function(statusCode, responseText) {
                        addDebugLog(`收到回调，状态码: ${statusCode}`, 'info');
                        addDebugLog(`响应长度: ${responseText ? responseText.length : 0} 字符`, 'info');
                        
                        delete window[callbackName];
                        
                        // 检查是否是错误对象
                        try {
                            const errorObj = JSON.parse(responseText);
                            if (errorObj.error_type) {
                                addDebugLog(`原生接口错误: ${errorObj.error_type} - ${errorObj.error_message}`, 'error');
                                reject(new Error(errorObj.error_message || '请求失败'));
                                return;
                            }
                        } catch (e) {
                            // 不是 JSON 错误对象，继续处理
                        }
                        
                        if (statusCode >= 200 && statusCode < 300) {
                            addDebugLog('请求成功，准备解析响应', 'info');
                            resolve({
                                status: statusCode,
                                json: () => Promise.resolve(JSON.parse(responseText))
                            });
                        } else {
                            addDebugLog(`HTTP 错误: ${statusCode}`, 'error');
                            reject(new Error(`HTTP ${statusCode}: ${responseText}`));
                        }
                    };
                    
                    try {
                        addDebugLog('调用 AndroidInterface.httpGet...', 'info');
                        AndroidInterface.httpGet(url, apiKey, callbackName);
                        addDebugLog('AndroidInterface.httpGet 调用完成', 'info');
                    } catch (e) {
                        addDebugLog(`调用 AndroidInterface.httpGet 失败: ${e.message}`, 'error');
                        delete window[callbackName];
                        reject(e);
                    }
                } else {
                    // 使用浏览器 fetch
                    addDebugLog('使用浏览器 fetch', 'info');
                    fetch(url, {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json'
                        }
                    }).then(response => {
                        addDebugLog(`fetch 响应: ${response.status}`, 'info');
                        resolve(response);
                    }).catch(err => {
                        addDebugLog(`fetch 错误: ${err.message}`, 'error');
                        reject(err);
                    });
                }
            });
        }

                addDebugLog('开始解析 JSON...', 'info');
                const data = await response.json();
                addDebugLog(`JSON解析成功: ${JSON.stringify(data).substring(0, 200)}...`, 'info');
                
                if (data.code === 200 && data.data && data.data.songs) {
                    const songs = data.data.songs;

                    switchPlaylist('search');
                    
                    showToast(`找到 ${formattedSongs.length} 首歌曲`);
                    addDebugLog('搜索流程完成', 'info');
                } else {
                    addDebugLog(`API返回错误: code=${data.code}, msg=${data.msg}`, 'error');
                    showErrorDialog('搜索失败', data.msg || '未找到歌曲');
                }
            } catch (error) {
                addDebugLog(`搜索异常: ${error.name} - ${error.message}`, 'error');
                addDebugLog(`错误堆栈: ${error.stack || '无堆栈信息'}`, 'error');
                console.error('搜索失败:', error);
                
                let errorMsg = '';
                if (error.name === 'AbortError' || error.message.includes('超时')) {
                    errorMsg = '请求超时，请检查网络连接。';
                } else if (error.message.includes('Failed to fetch') || error.message.includes('网络')) {
                    errorMsg = '网络请求失败，请确保设备已连接到互联网。';
                } else {
                    errorMsg = error.message;

                showErrorDialog('搜索失败', errorMsg);
            }
        }

        // 解析音乐搜索结果
        function parseMusicResult(data) {
            // 根据实际返回格式解析
            if (Array.isArray(data)) {
                return data.map((item, index) => ({
                    id: item.id || `song_${index}`,
                    name: item.name || item.songname || item.title || '未知歌曲',
                    artist: item.artist || item.singer || item.author || '未知歌手',
                    url: item.url || item.link || item.mp3 || '',
                    cover: item.cover || item.pic || item.img || item.albumPic || '',
                    duration: item.duration || item.time || '0:00'
                }));
            }
            
            // 如果是对象，尝试找到歌曲数组
            if (typeof data === 'object' && data !== null) {
                const possibleArrays = ['songs', 'list', 'data', 'result', 'music'];
                for (const key of possibleArrays) {
                    if (Array.isArray(data[key])) {
                        return parseMusicResult(data[key]);
                    }
                }
            }
            
            return [];
        }
        
        // 解析歌词
        function parseLyrics(lrcText) {
            if (!lrcText) return [];
            
            const lines = lrcText.split('\n');
            const lyrics = [];
            
            const timeRegex = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
            
            for (const line of lines) {
                const match = line.match(timeRegex);
                if (match) {
                    const minutes = parseInt(match[1]);
                    const seconds = parseInt(match[2]);
                    const milliseconds = parseInt(match[3].padEnd(3, '0'));
                    const text = match[4].trim();
                    
                    const time = minutes * 60 + seconds + milliseconds / 1000;
                    
                    if (text) {
                        lyrics.push({ time, text });
                    }
                }
            }
            
            return lyrics.sort((a, b) => a.time - b.time);
        }
        
        // 显示歌词
        function displayLyrics(lrcText) {
            const lyricsList = document.getElementById('lyricsList');
            
            if (!lrcText) {
                lyricsList.innerHTML = '<div class="lyric-line active">暂无歌词</div>';
                return;
            }
            
            const lyrics = parseLyrics(lrcText);
            
            if (lyrics.length === 0) {
                lyricsList.innerHTML = '<div class="lyric-line active">暂无歌词</div>';
                return;
            }
            
            lyricsList.innerHTML = lyrics.map((line, index) => 
                `<div class="lyric-line" data-time="${line.time}" data-index="${index}">${line.text}</div>`
            ).join('');
            
            // 保存歌词数据用于同步滚动
            window.currentLyrics = lyrics;
            window.currentLyricIndex = -1;
        }

            if (!window.currentLyrics || window.currentLyrics.length === 0) return;
            
            const lyrics = window.currentLyrics;
            let activeIndex = -1;
            
            for (let i = 0; i < lyrics.length; i++) {
                if (currentTime >= lyrics[i].time) {
                    activeIndex = i;
                } else {
                    break;
                }
            }
            
            if (activeIndex !== window.currentLyricIndex && activeIndex >= 0) {
                window.currentLyricIndex = activeIndex;
                
                // 更新高亮
                document.querySelectorAll('.lyric-line').forEach((line, index) => {
                    line.classList.toggle('active', index === activeIndex);

        async function playSong(index) {
            if (index < 0 || index >= currentSongs.length) return;
            
            currentSongIndex = index;
            const song = currentSongs[index];
            const audio = document.getElementById('audioPlayer');
            
            // 如果没有播放链接或歌词，先获取
            if (!song.url || !song.lrc) {
                showToast('正在获取歌曲信息...');
                const detail = await getSongDetail(song.name, song.n);
                if (detail && detail.url) {
                    song.url = detail.url;
                    song.cover = detail.cover || song.cover;
                    song.duration = detail.duration || song.duration;
                    song.lrc = detail.lrc || ''; // 保存歌词
                    
                    // 同时更新 playlists 中对应的歌曲
                    for (const playlistId in playlists) {
                        const playlistSongs = playlists[playlistId].songs;
                        const playlistSongIndex = playlistSongs.findIndex(s => s.id === song.id);
                        if (playlistSongIndex !== -1) {
                            playlistSongs[playlistSongIndex].url = song.url;
                            playlistSongs[playlistSongIndex].cover = song.cover;
                            playlistSongs[playlistSongIndex].duration = song.duration;
                            playlistSongs[playlistSongIndex].lrc = song.lrc;
                        }
                    }
                    
                    // 保存更新后的歌曲信息到 IndexedDB
                    await savePlaylists();
                    console.log('歌曲信息已保存，包括歌词:', song.lrc ? '有歌词' : '无歌词');
                    
                    // 显示歌词
                    if (song.lrc) {
                        displayLyrics(song.lrc);
                    }
                } else {
                    showToast('无法获取播放链接');
                    return;
                }
            } else if (song.lrc) {
                // 如果已经有歌词，直接显示
                displayLyrics(song.lrc);
            }
            
            // 更新音频源
            if (song.url) {
                audio.src = song.url;
                audio.play().then(() => {
                    isPlaying = true;
                    updatePlayerUI();
                    // 通知父页面音乐开始播放
                    if (window.parent !== window) {
                        window.parent.postMessage({ type: 'musicPlaying' }, '*');

                }).catch(err => {
                    console.error('播放失败:', err);
                    showToast('播放失败，请重试');

                showToast('暂无播放链接');

        // 向父页面发送歌词更新消息
        function sendLyricsToParent(lyricText) {

        // 更新桌面歌词 - 酷狗风格逐字动效
        function updateDesktopLyrics() {
            const desktopLyricsText = document.getElementById('desktopLyricsText');
            
            if (!window.currentLyrics || window.currentLyrics.length === 0) {
                desktopLyricsText.innerHTML = '<span class="lyric-char">暂无歌词</span>';
                currentLineText = '暂无歌词';
                sendLyricsToParent('暂无歌词');
                return;
            }
            
            const currentIndex = window.currentLyricIndex || 0;
            const lyric = window.currentLyrics[currentIndex];
            
            if (lyric && lyric.text) {
                // 计算当前行的持续时间
                const nextLyric = window.currentLyrics[currentIndex + 1];
                currentLineStartTime = lyric.time;
                currentLineDuration = nextLyric ? (nextLyric.time - lyric.time) : 3;
                currentLineText = lyric.text;
                currentCharIndex = 0;
                
                // 将歌词文本拆分成单个字符，每个字符包装在span中
                const chars = lyric.text.split('');
                desktopLyricsText.innerHTML = chars.map((char, index) => 
                    `<span class="lyric-char" data-index="${index}">${char}</span>`
                ).join('');
                
                // 向父页面发送歌词更新
                sendLyricsToParent(lyric.text);
            } else {
                desktopLyricsText.innerHTML = '<span class="lyric-char">暂无歌词</span>';
                currentLineText = '暂无歌词';
                sendLyricsToParent('暂无歌词');
            }
        }
        
        // 更新桌面歌词逐字进度
        function updateDesktopLyricsProgress(currentTime) {
            if (!window.currentLyrics || window.currentLyrics.length === 0) return;
            
            const currentIndex = window.currentLyricIndex || 0;
            const lyric = window.currentLyrics[currentIndex];
            if (!lyric || !lyric.text) return;
            
            // 只在iframe内且桌面歌词启用时更新本地显示
            if (desktopLyricsEnabled) {
                const chars = document.querySelectorAll('.desktop-lyrics-text .lyric-char');
                if (chars.length > 0) {
                    const lineProgress = currentTime - lyric.time;
                    const charCount = lyric.text.length;
                    const charDuration = currentLineDuration / charCount;
                    
                    chars.forEach((char, index) => {
                        const charStartTime = index * charDuration;
                        const charEndTime = (index + 1) * charDuration;
                        
                        if (lineProgress >= charEndTime) {
                            char.classList.remove('active');
                            char.classList.add('played');
                        } else if (lineProgress >= charStartTime) {
                            char.classList.remove('played');
                            char.classList.add('active');
                        } else {
                            char.classList.remove('active', 'played');
                        }
                    });
                }
            }
            
            // 计算当前字符索引并发送给父页面
            const lineProgress = currentTime - lyric.time;
            const charCount = lyric.text.length;
            const charDuration = currentLineDuration / charCount;
            const newCharIndex = Math.min(Math.floor(lineProgress / charDuration), charCount - 1);
            
            if (newCharIndex !== currentCharIndex || newCharIndex >= 0) {
                currentCharIndex = newCharIndex;
                sendLyricsProgressToParent(currentCharIndex, charCount);
            }
        }

        })();
        
        // 添加歌曲到歌单
        async function addToPlaylist(songIndex) {
            if (songIndex < 0 || songIndex >= currentSongs.length) return;
            
            const song = currentSongs[songIndex];
            
            // 创建选择歌单弹窗
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay show';
            overlay.style.zIndex = '2500';
            
            // 获取所有可添加的歌单（排除搜索结果）
            const availablePlaylists = Object.entries(playlists).filter(([id, p]) => id !== 'search');
            
            let playlistHtml = '';
            if (availablePlaylists.length === 0) {
                playlistHtml = '<div style="text-align: center; color: #999; padding: 20px;">暂无歌单，请先创建歌单</div>';
            } else {
                playlistHtml = availablePlaylists.map(([id, playlist]) => `
                    <div class="playlist-select-item" data-id="${id}" style="
                        padding: 12px 16px;
                        margin: 8px 0;
                        background: rgba(255,255,255,0.6);
                        border-radius: 12px;
                        cursor: pointer;
                        display: flex;
                        align-items: center;
                        gap: 10px;
                        transition: all 0.3s;
                    " onmouseover="this.style.background='rgba(212,165,116,0.2)'" onmouseout="this.style.background='rgba(255,255,255,0.6)'">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#D4A574" stroke-width="2">
                            <path d="M9 18V5l12-2v13M9 18c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2zm12-2c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2z"/>
                        </svg>
                        <span style="flex: 1; color: #5C4A3A;">${playlist.name}</span>
                        <span style="color: #999; font-size: 12px;">${playlist.songs.length}首</span>
                    </div>
                `).join('');
            }
            
            overlay.innerHTML = `
                <div class="modal-content" style="max-width: 300px;" onclick="event.stopPropagation()">
                    <div class="modal-title">添加到歌单</div>
                    <div style="max-height: 300px; overflow-y: auto; margin-bottom: 16px;">
                        ${playlistHtml}
                    </div>
                    <div class="modal-actions">
                        <button class="modal-btn cancel" onclick="this.closest('.modal-overlay').remove()">取消</button>
                        <button class="modal-btn confirm" onclick="this.closest('.modal-overlay').remove(); showCreatePlaylistModal();">新建歌单</button>
                    </div>
                </div>
            `;
            
            // 点击歌单项添加歌曲
            overlay.querySelectorAll('.playlist-select-item').forEach(item => {
                item.addEventListener('click', async () => {
                    const playlistId = item.dataset.id;
                    
                    // 检查歌曲是否已存在
                    const exists = playlists[playlistId].songs.some(s => s.id === song.id);
                    if (exists) {
                        showToast('歌曲已存在于该歌单');
                        overlay.remove();
                        return;
                    }
                    
                    // 添加歌曲到歌单
                    playlists[playlistId].songs.push({
                        ...song,
                        addedTime: Date.now()
                    });
                    
                    // 保存到 IndexedDB
                    await savePlaylists();
                    
                    showToast(`已添加到 ${playlists[playlistId].name}`);
                    overlay.remove();
                    
                    // 如果当前显示的是该歌单，刷新列表
                    if (currentPlaylist === playlistId) {
                        renderSongsList();
                    }
                });
            });
            
            document.body.appendChild(overlay);
        }
        
        function showPlaylistManager() {
            showToast('歌单管理功能开发中');
        }
        
        // ==================== 歌词功能（模拟）====================

            // 需要解析歌词文件并根据当前播放时间更新
        }
    </script>
