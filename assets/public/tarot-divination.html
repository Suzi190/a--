<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>气运之门 - 塔罗占卜</title>
    
    <!-- 神秘字体 -->
    <link href="https://fontsapi.zeoseven.com/492/main/result.css" rel="stylesheet">
    
    <!-- localforage 本地存储库 -->
    <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            color: #fff;
        }
        
        /* 星空背景 */
        .stars-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        
        /* 神秘光晕 */
        .mystic-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.15) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
            animation: pulse 4s infinite ease-in-out;
        }
        
        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.8; }
        }
        
        /* 状态栏占位 */
        .status-bar-placeholder {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 30px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0.3));
            z-index: 101;
            pointer-events: none;
        }

        /* 顶部导航 */
        .header {
            position: fixed;
            top: 30px;
            left: 0;
            right: 0;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
        }
        
        .back-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .back-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.05);
        }
        
        .back-btn svg {
            width: 20px;
            height: 20px;
            fill: white;
        }
        
        .page-title {
            font-size: 18px;
            font-weight: 600;
            color: #e0d5ff;
            text-shadow: 0 0 20px rgba(138, 43, 226, 0.5);
            letter-spacing: 2px;
        }
        
        .header-right {
            width: 40px;
        }
        
        /* 主容器 */
        .main-container {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: 110px;
            padding-bottom: 20px;
        }
        
        /* 问题输入区域 */
        .question-section {
            padding: 0 20px;
            margin-bottom: 20px;
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        
        .question-section.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .question-label {
            font-size: 14px;
            color: #a090d0;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 1px;
        }
        
        .question-input-wrapper {
            position: relative;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            border: 1px solid rgba(138, 43, 226, 0.3);
            padding: 15px 20px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        
        .question-input-wrapper:focus-within {
            border-color: rgba(138, 43, 226, 0.8);
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.2);
        }
        
        .question-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 16px;
            text-align: center;
            font-family: inherit;
        }
        
        .question-input::placeholder {
            color: rgba(255,255,255,0.4);
        }
        
        /* 开始占卜按钮 */
        .start-btn {
            display: block;
            margin: 20px auto;
            padding: 15px 50px;
            background: linear-gradient(135deg, #8a2be2 0%, #4a0080 100%);
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(138, 43, 226, 0.4);
            letter-spacing: 2px;
        }
        
        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(138, 43, 226, 0.5);
        }
        
        /* 卡牌区域 */
        .cards-area {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 1500px;
            overflow: hidden;
        }
        
        /* 牌组容器 */
        .deck-container {
            position: relative;
            width: 100px;
            height: 160px;
            cursor: pointer;
            transition: all 0.5s ease;
            z-index: 50;
        }
        
        .deck-container.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8);
        }
        
        /* 牌背 */
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(135deg, #2d1b4e 0%, #1a0f2e 100%);
            border: 2px solid #8a2be2;
            box-shadow: 
                0 10px 30px rgba(0,0,0,0.5),
                inset 0 0 30px rgba(138, 43, 226, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            backface-visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .card-back::before {
            content: '';
            position: absolute;
            width: 80%;
            height: 80%;
            border: 1px solid rgba(138, 43, 226, 0.5);
            border-radius: 6px;
        }
        
        .card-back-pattern {
            width: 60%;
            height: 60%;
            background: 
                radial-gradient(circle at 30% 30%, rgba(138, 43, 226, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 70% 70%, rgba(75, 0, 130, 0.3) 0%, transparent 50%);
            border-radius: 50%;
            position: relative;
        }
        
        .card-back-pattern::after {
            content: '✦';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: rgba(138, 43, 226, 0.6);
        }
        
        /* 堆叠的牌 */
        .deck-card {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        
        .deck-card:nth-child(1) { transform: translate(0, 0); }
        .deck-card:nth-child(2) { transform: translate(1px, 1px); }
        .deck-card:nth-child(3) { transform: translate(2px, 2px); }
        .deck-card:nth-child(4) { transform: translate(3px, 3px); }
        .deck-card:nth-child(5) { transform: translate(4px, 4px); }
        
        /* 点击提示 */
        .deck-hint {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            white-space: nowrap;
            animation: hintPulse 2s infinite ease-in-out;
            text-align: center;
        }
        
        @keyframes hintPulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
        
        /* 洗牌动画区域 */
        .shuffle-area {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 40;
        }
        
        .shuffle-card {
            position: absolute;
            width: 60px;
            height: 100px;
            left: 50%;
            top: 50%;
            margin-left: -30px;
            margin-top: -50px;
            border-radius: 8px;
            background: linear-gradient(135deg, #2d1b4e 0%, #1a0f2e 100%);
            border: 2px solid #8a2be2;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: rgba(138, 43, 226, 0.6);
            transition: none;
        }
        
        .shuffle-card::after {
            content: '✦';
        }
        
        /* 扇形牌阵区域 */
        .fan-area {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            overflow: hidden;
        }
        
        .fan-area.show {
            display: block;
            opacity: 1;
        }
        
        /* 上半部分扇形 */
        .fan-upper {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 35%;
        }
        
        /* 下半部分扇形 */
        .fan-lower {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 35%;
        }
        
        /* 扇形中的牌 */
        .fan-card {
            position: absolute;
            width: 70px;
            height: 120px;
            border-radius: 8px;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            left: 50%;
            top: 50%;
            margin-left: -35px;
            margin-top: -60px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }
        
        .fan-card:hover {
            transform: scale(1.15) translateY(-15px) !important;
            z-index: 100 !important;
            box-shadow: 0 15px 40px rgba(138, 43, 226, 0.5);
        }
        
        .fan-card.flipped .card-inner {
            transform: rotateY(180deg);
        }
        
        .fan-card.reversed .card-inner {
            transform: rotateY(180deg) rotateZ(180deg);
        }
        
        .fan-card.reversed.selected {
            box-shadow: 0 0 30px rgba(255, 50, 50, 0.8);
            animation: reversedPulse 1.5s infinite ease-in-out;
        }
        
        @keyframes reversedPulse {
            0%, 100% { box-shadow: 0 0 30px rgba(255, 50, 50, 0.8); }
            50% { box-shadow: 0 0 50px rgba(255, 50, 50, 1); }
        }
        
        .fan-card.selected {
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.9);
            animation: selectedPulse 1.5s infinite ease-in-out;
        }
        
        @keyframes selectedPulse {
            0%, 100% { box-shadow: 0 0 30px rgba(255, 215, 0, 0.9); }
            50% { box-shadow: 0 0 50px rgba(255, 215, 0, 1); }
        }
        
        .fan-card.disabled {
            opacity: 0.3;
            pointer-events: none;
            filter: grayscale(0.9);
        }
        
        /* 卡牌内部 */
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .card-front, .card-back-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            backface-visibility: hidden;
            overflow: hidden;
        }
        
        .card-back-face {
            background: linear-gradient(135deg, #1a0a2e 0%, #0d0518 100%);
            border: 2px solid #4a0080;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .card-back-face::before {
            content: '';
            position: absolute;
            width: 85%;
            height: 85%;
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 6px;
        }
        
        .card-back-face::after {
            content: '✦';
            font-size: 28px;
            color: rgba(138, 43, 226, 0.5);
        }
        
        .card-front {
            background: #fff;
            transform: rotateY(180deg);
            border: 1px solid #d4af37;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 4px;
        }
        
        .card-front-img {
            width: 100%;
            height: 85%;
            object-fit: cover;
            border-radius: 4px;
        }
        
        .card-front-name {
            font-size: 9px;
            color: #4a0080;
            text-align: center;
            margin-top: 2px;
            font-weight: 600;
            line-height: 1.1;
        }
        
        /* 状态提示 */
        .status-text {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: rgba(255,255,255,0.9);
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 60;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(138, 43, 226, 0.3);
            white-space: nowrap;
        }
        
        .status-text.show {
            opacity: 1;
        }
        
        /* 选牌计数器 */
        .selection-counter {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(138, 43, 226, 0.3);
            border: 1px solid rgba(138, 43, 226, 0.5);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            color: #e0d5ff;
            z-index: 55;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .selection-counter.show {
            opacity: 1;
        }
        
        /* 结果展示区域 */
        .result-section {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 200;
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            overflow-y: auto;
            padding: 80px 20px 40px;
        }
        
        .result-section.show {
            display: block;
            opacity: 1;
        }
        
        .result-content {
            max-width: 400px;
            margin: 0 auto;
        }
        
        .result-title {
            font-size: 24px;
            color: #e0d5ff;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(138, 43, 226, 0.5);
        }
        
        .result-cards {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .result-card {
            width: 100px;
            height: 175px;
            background: #fff;
            border-radius: 10px;
            border: 2px solid #d4af37;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 5px;
            overflow: hidden;
        }
        
        .result-card-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 5px;
        }
        
        .result-card-name {
            font-size: 11px;
            color: #4a0080;
            text-align: center;
            margin-top: 4px;
            font-weight: 600;
        }
        
        .result-card-position {
            font-size: 10px;
            color: #8a2be2;
            margin-top: 2px;
        }
        
        .result-card.reversed {
            border-color: #ff4444;
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.3);
        }
        
        .result-card.reversed .result-card-name {
            color: #ff4444;
        }
        
        .result-card.reversed .result-card-position {
            color: #ff6666;
        }
        
        .result-interpretation {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(138, 43, 226, 0.3);
        }
        
        .result-question {
            font-size: 14px;
            color: #a090d0;
            margin-bottom: 15px;
            text-align: center;
            font-style: italic;
        }
        
        .result-text {
            font-size: 14px;
            line-height: 1.8;
            color: rgba(255,255,255,0.9);
        }
        
        .result-text p {
            margin-bottom: 15px;
        }
        
        .close-result-btn {
            display: block;
            margin: 30px auto 0;
            padding: 12px 40px;
            background: rgba(138, 43, 226, 0.3);
            border: 1px solid rgba(138, 43, 226, 0.5);
            border-radius: 25px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .close-result-btn:hover {
            background: rgba(138, 43, 226, 0.5);
        }
        
        /* AI大师解读按钮 */
        .ai-master-btn {
            display: block;
            margin: 20px auto;
            padding: 15px 40px;
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            border: none;
            border-radius: 30px;
            color: #1a1a2e;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
            letter-spacing: 2px;
        }
        
        .ai-master-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.5);
        }
        
        .ai-master-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .ai-master-btn.loading {
            background: linear-gradient(135deg, #666 0%, #333 100%);
            color: #fff;
        }
        
        /* AI解读内容区域 */
        .ai-interpretation {
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid rgba(138, 43, 226, 0.3);
        }
        
        .ai-interpretation-title {
            font-size: 18px;
            color: #ffd700;
            text-align: center;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }
        
        .ai-interpretation-content {
            font-size: 14px;
            line-height: 1.8;
            color: rgba(255,255,255,0.95);
            background: rgba(255,215,0,0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,215,0,0.2);
        }
        
        .ai-interpretation-content p {
            margin-bottom: 12px;
        }
        
        /* 魔法粒子效果 */
        .magic-particle {
            position: fixed;
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, #fff 0%, #8a2be2 100%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 100;
            animation: particleFloat 1.5s ease-out forwards;
            box-shadow: 0 0 10px #8a2be2;
        }
        
        @keyframes particleFloat {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
        }
        
        /* 图片加载占位符 */
        .card-front-img {
            background: linear-gradient(135deg, #2d1b4e 0%, #1a0f2e 100%);
        }
        
        /* 加载指示器 */
        .loading-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 150;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        
        .loading-indicator.show {
            display: flex;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(138, 43, 226, 0.3);
            border-top-color: #8a2be2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 14px;
            color: #e0d5ff;
            text-align: center;
        }
        
        /* 牌阵选择弹窗 */
        .spread-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 500;
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease;
            overflow-y: auto;
            padding: 110px 20px 40px;
        }

        .spread-modal.show {
            display: block;
            opacity: 1;
        }

        .spread-modal-content {
            max-width: 400px;
            margin: 0 auto;
        }

        .spread-modal-title {
            font-size: 22px;
            color: #e0d5ff;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(138, 43, 226, 0.5);
        }

        .spread-modal-subtitle {
            font-size: 13px;
            color: #a090d0;
            text-align: center;
            margin-bottom: 25px;
        }

        .spread-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .spread-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 16px;
            padding: 16px 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .spread-item:hover {
            background: rgba(138, 43, 226, 0.15);
            border-color: rgba(138, 43, 226, 0.6);
            transform: translateX(5px);
        }

        .spread-item-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;

    <!-- 图片预加载和缓存优化 -->
    <script>
        // 图片缓存管理
        const imageCache = new Map();
        const preloadedImages = new Set();
        
        // 预加载单张图片
        function preloadImage(url) {
            if (preloadedImages.has(url)) return Promise.resolve();
            
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    imageCache.set(url, img);
                    preloadedImages.add(url);
                    resolve();
                };
                img.onerror = reject;
                img.src = url;
            });
        }
        
        // 批量预加载图片（带并发限制）
        async function preloadImages(urls, batchSize = 5) {
            for (let i = 0; i < urls.length; i += batchSize) {
                const batch = urls.slice(i, i + batchSize);
                await Promise.all(batch.map(url => preloadImage(url).catch(() => {})));
            }
        }
        
        // 获取图片URL（使用更快速的CDN或本地缓存）
        function getOptimizedImageUrl(originalUrl) {
            // 如果已经缓存，直接返回
            if (imageCache.has(originalUrl)) {
                return originalUrl;
            }
            return originalUrl;
        }
    </script>

        // 洗牌动画
        function shuffleDeck() {
            if (currentState === 'input') {
                showStatus('请先输入你的问题');
                return;
            }
            
            if (currentState !== 'shuffling') return;
            
            const deck = document.getElementById('deckContainer');
            const shuffleArea = document.getElementById('shuffleArea');
            
            deck.classList.add('hidden');
            
            // 创建78张飞散的牌
            const cards = [];
            for (let i = 0; i < 30; i++) { // 显示30张代表整副牌
                const card = document.createElement('div');
                card.className = 'shuffle-card';
                card.style.zIndex = 30 - i;
                shuffleArea.appendChild(card);
                cards.push(card);
            }
            
            showStatus('洗牌中...感受能量的流动');
            
            // 散开动画
            setTimeout(() => {
                cards.forEach((card, i) => {
                    const angle = (i / 30) * Math.PI * 2;
                    const radius = 150 + Math.random() * 100;
                    const x = Math.cos(angle) * radius;
                    const y = Math.sin(angle) * radius;
                    const rot = Math.random() * 360;
                    
                    card.style.transition = 'all 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
                    card.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`;
                });
                createMagicParticles(30);
            }, 100);
            
            // 打乱动画
            setTimeout(() => {
                showStatus('塔罗牌正在重新排列...');
                for (let round = 0; round < 3; round++) {
                    setTimeout(() => {
                        cards.forEach((card, i) => {
                            const randomX = (Math.random() - 0.5) * 300;
                            const randomY = (Math.random() - 0.5) * 400;
                            const randomRot = Math.random() * 720 - 360;
                            
                            card.style.transition = 'all 0.4s ease-out';
                            card.style.transform = `translate(${randomX}px, ${randomY}px) rotate(${randomRot}deg)`;
                        });
                        createMagicParticles(20);
                    }, round * 400);
                }
            }, 800);
            
            // 收拢并展开扇形
            setTimeout(() => {
                showStatus('牌阵即将展开...');
                cards.forEach((card, i) => {
                    setTimeout(() => {
                        card.style.transition = 'all 0.3s ease-in';
                        card.style.transform = 'translate(0, 0) rotate(0deg) scale(0)';
                        card.style.opacity = '0';
                    }, i * 20);
                });
                
                setTimeout(() => {
                    shuffleArea.innerHTML = '';
                    currentState = 'selecting';
                    spreadFanCards();
                }, 800);
            }, 2200);
        }
        
        // 展开扇形牌阵
        function spreadFanCards() {
            const fanArea = document.getElementById('fanArea');
            const fanUpper = document.getElementById('fanUpper');
            const fanLower = document.getElementById('fanLower');
            const counter = document.getElementById('selectionCounter');
            
            // 打乱牌序
            shuffledOrder = [...tarotCards].map((card, i) => ({ ...card, originalIndex: i }));
            shuffledOrder.sort(() => Math.random() - 0.5);
            
            // 清空
            fanUpper.innerHTML = '';
            fanLower.innerHTML = '';
            
            // 上半部分39张牌
            const upperCount = Math.ceil(shuffledOrder.length / 2);
            const upperCards = shuffledOrder.slice(0, upperCount);
            const lowerCards = shuffledOrder.slice(upperCount);
            
            // 创建上半扇形
            upperCards.forEach((card, i) => {
                createFanCard(card, i, upperCount, fanUpper, true);
            });
            
            // 创建下半扇形
            lowerCards.forEach((card, i) => {
                createFanCard(card, i, lowerCards.length, fanLower, false);
            });
            
            // 显示
            setTimeout(() => {
                fanArea.classList.add('show');
                counter.classList.add('show');
                updateCounter();
                showStatus(`从78张牌中选择${currentSpread.count}张，进行「${currentSpread.name}」占卜`);
            }, 500);
        }
        
        // 创建扇形卡牌
        function createFanCard(card, index, total, container, isUpper) {
            const cardEl = document.createElement('div');
            cardEl.className = 'fan-card';
            cardEl.dataset.index = index;
            cardEl.dataset.originalIndex = card.originalIndex;
            
            // 计算扇形位置
            const fanAngle = 140; // 扇形总角度
            const startAngle = -fanAngle / 2;
            const angleStep = fanAngle / (total - 1);
            const angle = startAngle + index * angleStep;
            
            // 半径根据数量调整
            const radius = isUpper ? 180 : 160;
            
            // 计算位置
            const rad = (angle * Math.PI) / 180;
            const x = Math.sin(rad) * radius;
            const y = isUpper ? -Math.cos(rad) * radius * 0.3 : Math.cos(rad) * radius * 0.3;
            
            cardEl.style.transform = `translate(${x}px, ${y}px) rotate(${angle}deg)`;
            
            // 先创建牌背，图片加载后再显示
            cardEl.innerHTML = `
                <div class="card-inner">
                    <div class="card-back-face"></div>
                    <div class="card-front">
                        <img class="card-front-img" src="${card.img}" alt="${card.name}" loading="eager" style="opacity: 0; transition: opacity 0.3s ease;">
                        <div class="card-front-name">${card.name}</div>
                    </div>
                </div>
            `;
            
            // 图片加载完成后的处理
            const img = cardEl.querySelector('.card-front-img');
            if (imageCache.has(card.img)) {
                // 如果已缓存，直接显示
                img.style.opacity = '1';
            } else {
                // 否则等待加载完成
                img.onload = () => {
                    img.style.opacity = '1';
                    imageCache.set(card.img, img);
                };
                img.onerror = () => {
                    // 加载失败时显示备用内容
                    img.style.display = 'none';
                    const fallback = document.createElement('div');
                    fallback.style.cssText = 'width: 100%; height: 85%; background: linear-gradient(135deg, #8a2be2 0%, #4a0080 100%); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 24px;';
                    fallback.textContent = card.name.charAt(0);
                    img.parentNode.insertBefore(fallback, img);
                };
            }
            
            cardEl.addEventListener('click', () => selectFanCard(cardEl, card, card.originalIndex));
            container.appendChild(cardEl);
            
            // 入场动画
            cardEl.style.opacity = '0';
            setTimeout(() => {
                cardEl.style.opacity = '1';
            }, index * 10);
        }
        
        // 选择卡牌
        function selectFanCard(cardEl, card, index) {
            if (currentState !== 'selecting') return;

            const maxCards = currentSpread.count;

            if (selectedCards.length >= maxCards) {
                showStatus(`已经选择了${maxCards}张牌，点击已选中的牌可以取消`);
                return;
            }

            const existingIndex = selectedCardIndices.indexOf(index);
            if (existingIndex !== -1) {
                selectedCards.splice(existingIndex, 1);
                selectedCardIndices.splice(existingIndex, 1);
                cardEl.classList.remove('selected', 'flipped', 'reversed');
                updateCounter();
                showStatus(`已取消选择，还需选择 ${maxCards - selectedCards.length} 张牌`);
                return;
            }

            // 添加到已选，随机决定正位或逆位（50%概率）
            const isReversed = Math.random() < 0.5;
            selectedCardIndices.push(index);
            selectedCards.push({
                ...card,
                position: spreadPositions[selectedCards.length],
                order: selectedCards.length,
                isReversed: isReversed
            });

            // 根据正逆位设置翻转样式
            cardEl.classList.add('selected', 'flipped');
            if (isReversed) {
                cardEl.classList.add('reversed');
            }
            createMagicParticles(10, cardEl);

            updateCounter();

            if (selectedCards.length >= maxCards) {
                showStatus(`已选择${maxCards}张牌，正在揭示命运...`);

                setTimeout(() => {
                    document.querySelectorAll('.fan-card:not(.selected)').forEach(card => {
                        card.classList.add('disabled');
                    });
                }, 500);

                setTimeout(() => {
                    currentState = 'revealed';
                    showResult();
                }, 1500);
            } else {
                showStatus(`已选择 ${selectedCards.length}/${maxCards} 张牌，继续选择`);
            }
        }

        // 更新计数器
        function updateCounter() {
            const counter = document.getElementById('selectionCounter');
            counter.textContent = `已选择 ${selectedCards.length}/${currentSpread.count} 张牌`;
        }
        
        // 创建魔法粒子
        function createMagicParticles(count = 20, targetEl = null) {
            let centerX, centerY;
            
            if (targetEl) {
                const rect = targetEl.getBoundingClientRect();
                centerX = rect.left + rect.width / 2;
                centerY = rect.top + rect.height / 2;
            } else {
                centerX = window.innerWidth / 2;
                centerY = window.innerHeight / 2;
            }
            
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'magic-particle';
                particle.style.left = centerX + 'px';
                particle.style.top = centerY + 'px';
                
                const angle = (Math.PI * 2 * i) / count;
                const distance = 100 + Math.random() * 150;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                document.body.appendChild(particle);
                
                setTimeout(() => particle.remove(), 1500);
            }
        }

            const orderedCards = selectedCards.sort((a, b) => a.order - b.order);
            
            resultCards.innerHTML = orderedCards.map((card, i) => `

                    <div class="result-card-position">${spreadPositions[i]}</div>

            `).join('');
            
            resultQuestion.textContent = `「${userQuestion}」`;
            
            const interpretation = generateInterpretation(orderedCards);
            resultText.innerHTML = interpretation;

            // 综合解读
            const cardNames = cards.map(c => `${c.name}(${c.isReversed ? '逆位' : '正位'})`).join('、');
            interpretationHTML += `<p><strong>综合解读：</strong>「${currentSpread.name}」牌阵为你揭示了${cards.length}个面向的能量。${cardNames}共同编织出你当前问题的全貌。相信你的直觉，宇宙正在以它独特的方式引导着你。记住，塔罗牌展示的是可能的趋势，而你的选择和行动才是最终决定命运的关键。</p>`;

            return interpretationHTML;
        }
        
        // 获取AI大师解读
        async function getAIMasterInterpretation() {
            const btn = document.getElementById('aiMasterBtn');
            const aiSection = document.getElementById('aiInterpretation');
            const aiContent = document.getElementById('aiInterpretationContent');
            
            // 防止重复点击
            if (btn.disabled) return;
            
            btn.disabled = true;
            btn.classList.add('loading');
            btn.textContent = '大师正在解读中...';
            
            try {
                // 获取API设置
                const apiConfig = await loadApiSettings();
                
                console.log('【塔罗牌】获取到的API配置:', {
                    apiUrl: apiConfig.apiUrl,
                    model: apiConfig.model,
                    hasApiKey: !!apiConfig.apiKey,
                    apiKeyLength: apiConfig.apiKey ? apiConfig.apiKey.length : 0
                });
                
                if (!apiConfig.apiKey) {
                    const errorMsg = '未找到API密钥设置。\n\n请先在"呼叫爱人"页面设置API信息，设置会自动同步到塔罗牌功能。\n\n设置路径：呼叫爱人 → 设置 → API设置';
                    alert(errorMsg);
                    btn.disabled = false;
                    btn.classList.remove('loading');
                    btn.textContent = '请大师解读';
                    return;
                }
                
                // 构建提示词
                const prompt = buildAIPrompt();
                
                // 调用API
                const response = await callAIAPI(apiConfig, prompt);
                
                // 显示AI解读
                aiContent.innerHTML = formatAIResponse(response);
                aiSection.style.display = 'block';
                
                // 滚动到AI解读区域
                aiSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                
                btn.textContent = '已获取大师解读';
                
            } catch (error) {
                console.error('AI解读失败:', error);
                aiContent.innerHTML = '<p style="color: #ff6666;">大师解读暂时不可用，请检查API设置或稍后重试。</p>';
                aiSection.style.display = 'block';
                btn.disabled = false;
                btn.classList.remove('loading');
                btn.textContent = '重新请求大师解读';
            }
        }
        
        // 加载API设置
        async function loadApiSettings() {
            console.log('【塔罗牌】开始加载API设置...');
            
            // 尝试从localforage加载
            try {
                if (typeof localforage !== 'undefined') {
                    const settings = await localforage.getItem('appSettings');
                    console.log('【塔罗牌】localforage读取结果:', settings);
                    
                    if (settings && settings.api) {
                        const config = {
                            apiKey: settings.api.apiKey || '',
                            apiUrl: settings.api.baseUrl || 'https://api.openai.com/v1',
                            model: settings.api.model || 'gpt-4o-mini'
                        };
                        console.log('【塔罗牌】从localforage加载API配置:', {
                            apiUrl: config.apiUrl,
                            model: config.model,
                            hasApiKey: !!config.apiKey
                        });
                        return config;
                    }
                } else {
                    console.log('【塔罗牌】localforage未定义，跳过');
                }
            } catch (e) {
                console.error('【塔罗牌】localforage加载失败:', e);
            }
            
            // 降级到localStorage
            try {
                const rawData = localStorage.getItem('appSettings');
                console.log('【塔罗牌】localStorage原始数据:', rawData ? '存在' : '不存在');
                
                if (rawData) {
                    const settings = JSON.parse(rawData);
                    console.log('【塔罗牌】localStorage解析结果:', settings);
                    
                    if (settings.api) {
                        const config = {
                            apiKey: settings.api.apiKey || '',
                            apiUrl: settings.api.baseUrl || 'https://api.openai.com/v1',
                            model: settings.api.model || 'gpt-4o-mini'
                        };
                        console.log('【塔罗牌】从localStorage加载API配置:', {
                            apiUrl: config.apiUrl,
                            model: config.model,
                            hasApiKey: !!config.apiKey
                        });
                        return config;
                    }
                }
            } catch (e) {
                console.error('【塔罗牌】localStorage加载失败:', e);
            }
            
            // 尝试直接读取可能的其他存储键
            try {
                const apiKey = localStorage.getItem('api_key') || localStorage.getItem('apiKey');
                const apiUrl = localStorage.getItem('api_url') || localStorage.getItem('apiUrl') || localStorage.getItem('api_base_url');
                const model = localStorage.getItem('api_model') || localStorage.getItem('model');
                
                if (apiKey) {
                    console.log('【塔罗牌】从独立存储键加载API配置');
                    return {
                        apiKey: apiKey,
                        apiUrl: apiUrl || 'https://api.openai.com/v1',
                        model: model || 'gpt-4o-mini'
                    };
                }
            } catch (e) {
                console.error('【塔罗牌】独立存储键读取失败:', e);
            }
            
            console.log('【塔罗牌】未能找到API配置');
            return { apiKey: '', apiUrl: 'https://api.openai.com/v1', model: 'gpt-4o-mini' };
        }
        
        // 构建AI提示词
        function buildAIPrompt() {
            const orderedCards = selectedCards.sort((a, b) => a.order - b.order);

            const getCardInfo = (card) => {
                const position = card.isReversed ? '逆位' : '正位';
                return `${card.name}(${position})`;
            };

            // 构建牌阵描述
            let cardsDescription = '';
            orderedCards.forEach((card, i) => {
                const position = spreadPositions[i] || `第${i + 1}张`;
                cardsDescription += `- ${position}：${getCardInfo(card)}\n`;
            });

            return `你是一个专业的塔罗牌占卜师，拥有深厚的塔罗牌知识和丰富的占卜经验。

用户的问题是：「${userQuestion}」

使用的牌阵是「${currentSpread.name}」，共${currentSpread.count}张牌。

抽到的牌分别是：
${cardsDescription}

请从专业占卜师的角度，客观、真实地解读这个牌阵对用户问题的启示。

解读要求：
1. 客观分析，不要刻意讨好用户
2. 结合正逆位的不同含义
3. 给出具体、有深度的洞察
4. 可以指出问题或挑战，但要建设性
5. 语言风格神秘而专业，像一位睿智的占卜大师
6. 根据「${currentSpread.name}」牌阵的特点，分别解读每个位置的含义

请用中文回答，分段阐述每张牌的影响，最后给出综合建议。`;
        }
        
        // 调用AI API
        async function callAIAPI(config, prompt) {
            const response = await fetch(`${config.apiUrl}/chat/completions`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${config.apiKey}`
                },
                body: JSON.stringify({
                    model: config.model,
                    messages: [
                        { role: 'system', content: '你是一位专业的塔罗牌占卜大师，拥有神秘而深邃的智慧。' },
                        { role: 'user', content: prompt }
                    ],
                    temperature: 0.8,
                    max_tokens: 1500
                })
            });
            
            if (!response.ok) {
                throw new Error(`API请求失败: ${response.status}`);
            }
            
            const data = await response.json();
            return data.choices[0].message.content;
        }
        
        // 格式化AI响应
        function formatAIResponse(text) {
            // 将换行符转换为段落
            const paragraphs = text.split('\n\n').filter(p => p.trim());
            return paragraphs.map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
        }
        
        // 关闭结果
        function closeResult() {
            const resultSection = document.getElementById('resultSection');
            const fanArea = document.getElementById('fanArea');
            const counter = document.getElementById('selectionCounter');
            const deck = document.getElementById('deckContainer');
            const aiSection = document.getElementById('aiInterpretation');
            const aiContent = document.getElementById('aiInterpretationContent');
            const aiBtn = document.getElementById('aiMasterBtn');
            const spreadModal = document.getElementById('spreadModal');

            resultSection.classList.remove('show');
            fanArea.classList.remove('show');
            counter.classList.remove('show');
            spreadModal.classList.remove('show');

            // 重置AI解读区域
            aiSection.style.display = 'none';
            aiContent.innerHTML = '';
            aiBtn.disabled = false;
            aiBtn.classList.remove('loading');
            aiBtn.textContent = '请大师解读';

            currentState = 'input';
            selectedCards = [];
            selectedCardIndices = [];
            userQuestion = '';
            shuffledOrder = [];

            document.getElementById('questionSection').classList.remove('hidden');
            document.getElementById('questionInput').value = '';
            document.getElementById('fanUpper').innerHTML = '';
            document.getElementById('fanLower').innerHTML = '';
            deck.classList.remove('hidden');
            document.querySelector('.deck-hint').innerHTML = '点击洗牌<br>展开全部78张牌';

            hideStatus();
        }
        
        // 显示状态提示
        function showStatus(text) {
            const statusEl = document.getElementById('statusText');
            statusEl.textContent = text;
            statusEl.classList.add('show');
            
            setTimeout(() => {
                if (statusEl.textContent === text) {
                    statusEl.classList.remove('show');
                }
            }, 3000);
        }
        
        // 隐藏状态提示
        function hideStatus() {
            const statusEl = document.getElementById('statusText');
            statusEl.classList.remove('show');
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initStars();
        });
    </script>
</body>
