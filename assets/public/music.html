    <script>
        // ==================== IndexedDB 存储 ====================
        const DB_NAME = 'MusicDB';
        const DB_VERSION = 3; // 增加版本号以触发onupgradeneeded
        let db = null;
        
        // 初始化 IndexedDB
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                
                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    resolve(db);
                };
                
                request.onupgradeneeded = (event) => {
                    const database = event.target.result;
                    
                    // 创建歌单存储
                    if (!database.objectStoreNames.contains('playlists')) {
                        database.createObjectStore('playlists', { keyPath: 'id' });
                    }
                    
                    // 创建搜索历史存储
                    if (!database.objectStoreNames.contains('searchHistory')) {
                        database.createObjectStore('searchHistory', { keyPath: 'id' });
                    }
                    
                    // 创建轮播图存储
                    if (!database.objectStoreNames.contains('carousel')) {
                        database.createObjectStore('carousel', { keyPath: 'id' });
                    }
                    
                    // 创建设置存储
                    if (!database.objectStoreNames.contains('settings')) {
                        database.createObjectStore('settings', { keyPath: 'id' });
                    }
                    
                    // 创建一起听歌存储
                    if (!database.objectStoreNames.contains('listenTogether')) {
                        database.createObjectStore('listenTogether', { keyPath: 'id' });
                    }
                };
            });
        }
        
        // 保存数据到 IndexedDB
        function saveToDB(storeName, id, data) {
            return new Promise((resolve, reject) => {
                if (!db) {
                    reject(new Error('Database not initialized'));
                    return;
                }
                
                const transaction = db.transaction([storeName], 'readwrite');
                const store = transaction.objectStore(storeName);
                const request = store.put({ id, data, timestamp: Date.now() });
                
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }
        
        // 从 IndexedDB 获取数据
        function getFromDB(storeName, id) {
            return new Promise((resolve, reject) => {
                if (!db) {
                    resolve(null);
                    return;
                }
                
                const transaction = db.transaction([storeName], 'readonly');
                const store = transaction.objectStore(storeName);
                const request = store.get(id);
                
                request.onsuccess = () => {
                    const result = request.result;
                    resolve(result ? result.data : null);
                };
                request.onerror = () => reject(request.error);
            });
        }
        
        // 从 IndexedDB 删除数据
        function removeFromDB(storeName, id) {
            return new Promise((resolve, reject) => {
                if (!db) {
                    resolve();
                    return;
                }
                
                const transaction = db.transaction([storeName], 'readwrite');
                const store = transaction.objectStore(storeName);
                const request = store.delete(id);
                
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }
        
        // ==================== 数据存储 ====================
        let playlists = {
            'default': { name: '默认歌单', songs: [] },
            'search': { name: '搜索结果', songs: [] }
        };
        let currentPlaylist = 'all';
        let currentSongIndex = -1;
        let isPlaying = false;
        let playMode = 'list'; // list, random, single
        let searchHistory = [];
        let currentSongs = [];
        let currentSlide = 0;
        let playingPlaylist = 'all'; // 【新增】记录当前播放歌曲所属的歌单
        
        // 从 IndexedDB 加载数据
        async function loadDataFromDB() {
            try {
                await initDB();
                
                // 加载歌单
                const savedPlaylists = await getFromDB('playlists', 'main');
                if (savedPlaylists) {
                    playlists = savedPlaylists;
                }
                
                // 加载搜索历史
                const savedHistory = await getFromDB('searchHistory', 'main');
                if (savedHistory) {
                    searchHistory = savedHistory;
                }
                
                // 加载轮播图
                const savedCarousel = await getFromDB('carousel', 'main');
                if (savedCarousel) {
                    carouselData = savedCarousel;
                }
                
                console.log('数据已从 IndexedDB 加载');
            } catch (error) {
                console.error('加载数据失败:', error);
            }
        }
        
        // ==================== Service Worker 注册 ====================
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(registration => {
                    console.log('Service Worker 注册成功:', registration);
                })
                .catch(error => {
                    console.log('Service Worker 注册失败:', error);
                });
        }
        
        // 请求后台播放权限（iOS Safari 需要）
        function requestAudioSession() {
            if ('audioSession' in navigator) {
                navigator.audioSession.type = 'playback';
                console.log('音频会话类型设置为 playback');
            }
        }
        
        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', async function() {
            // 请求音频权限
            requestAudioSession();

            // 先从 IndexedDB 加载数据
            await loadDataFromDB();

            initPlaylistTabs();
            renderSongsList();
            initCarousel();
            renderSearchHistory();
            initAudioPlayer();

            // 加载桌面歌词状态
            await loadDesktopLyricsState();

            // 初始化歌词长按关闭功能
            initLyricsLongPress();
        });
        
        // ==================== 歌单管理 ====================
        function initPlaylistTabs() {
            const tabsContainer = document.getElementById('playlistTabs');
            tabsContainer.innerHTML = '<button class="playlist-tab active" data-playlist="all" onclick="switchPlaylist(\'all\')">全部</button>';
            
            for (const [id, playlist] of Object.entries(playlists)) {
                const tab = document.createElement('button');
                tab.className = 'playlist-tab';
                tab.dataset.playlist = id;
                tab.textContent = playlist.name;
                tab.onclick = () => switchPlaylist(id);
                tabsContainer.appendChild(tab);
            }
        }
        
        function switchPlaylist(playlistId) {
            currentPlaylist = playlistId;
            
            // 更新标签样式
            document.querySelectorAll('.playlist-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.playlist === playlistId);
            });
            
            renderSongsList();
        }
        
        function renderSongsList() {
            const container = document.getElementById('songsList');
            
            console.log('renderSongsList - currentPlaylist:', currentPlaylist);
            console.log('renderSongsList - playlists:', playlists);
            
            // 获取当前歌单的歌曲
            let songs = [];
            if (currentPlaylist === 'all') {
                for (const playlist of Object.values(playlists)) {
                    songs = songs.concat(playlist.songs);
                }
            } else if (playlists[currentPlaylist]) {
                songs = playlists[currentPlaylist].songs;
            }
            
            console.log('renderSongsList - songs:', songs);
            
            currentSongs = songs;
            
            if (songs.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
                            <path d="M9 18V5l12-2v13M9 18c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2zm12-2c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2z"/>
                        </svg>
                        <div class="empty-state-text">暂无歌曲</div>
                        <div class="empty-state-hint">搜索歌曲或创建歌单开始享受音乐</div>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = songs.map((song, index) => `
                <div class="song-item ${currentSongIndex === index && isPlaying ? 'playing' : ''}" onclick="playSong(${index})">
                    <div class="song-number">${index + 1}</div>
                    <div class="song-cover">
                        ${song.cover ? `<img src="${song.cover}" alt="${song.name}">` : `
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
                                <path d="M9 18V5l12-2v13M9 18c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2zm12-2c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2z"/>
                            </svg>
                        `}
                    </div>
                    <div class="song-info">
                        <div class="song-name">${song.name}</div>
                        <div class="song-artist">${song.artist}</div>
                    </div>
                    <div class="song-duration">${song.duration || '0:00'}</div>
                    <div class="song-actions">
                        <button class="song-action-btn" onclick="event.stopPropagation(); addToPlaylist(${index})" title="添加到歌单">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                                <circle cx="12" cy="12" r="1"/>
                                <circle cx="19" cy="12" r="1"/>
                                <circle cx="5" cy="12" r="1"/>
                            </svg>
                        </button>
                        <button class="song-action-btn" onclick="event.stopPropagation(); deleteSong(${index})" title="删除歌曲">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                                <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                            </svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }
        
        function showCreatePlaylistModal() {
            document.getElementById('createPlaylistModal').classList.add('show');
            document.getElementById('playlistNameInput').focus();
        }
        
        function hideCreatePlaylistModal() {
            document.getElementById('createPlaylistModal').classList.remove('show');
            document.getElementById('playlistNameInput').value = '';
        }
        
        function closeModal(event) {
            if (event.target === event.currentTarget) {
                hideCreatePlaylistModal();
            }
        }
        
        function createPlaylist() {
            const name = document.getElementById('playlistNameInput').value.trim();
            if (!name) {
                showToast('请输入歌单名称');
                return;
            }
            
            const id = 'playlist_' + Date.now();
            playlists[id] = { name, songs: [] };
            savePlaylists();
            
            initPlaylistTabs();
            hideCreatePlaylistModal();

        // 通用 HTTP GET 请求（使用 fetch，带超时和错误处理）
        async function httpGet(url, apiKey = '') {
            console.log('[httpGet] 请求:', url);
            
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 30000); // 30秒超时
            
            try {
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    },
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                console.log('[httpGet] 响应状态:', response.status);
                return response;
            } catch (error) {
                clearTimeout(timeoutId);
                console.error('[httpGet] 请求失败:', error);
                throw error;
            }
        }
        
        // 通过原生接口获取二进制数据（音频、图片等）
        async function fetchBinaryViaNative(url, mimeType = 'audio/mpeg') {
            if (!isAndroidApp() || !AndroidShell.fetchBinaryData) {
                // 不在 APP 中或原生方法不存在，直接返回原 URL
                return url;
            }
            
            return new Promise((resolve, reject) => {
                const callbackName = 'binaryCallback_' + Date.now();
                
                window[callbackName] = function(statusCode, base64Data) {
                    delete window[callbackName];
                    
                    if (statusCode === 200 && base64Data) {
                        try {
                            // 将 base64 转换为 Blob URL
                            const byteCharacters = atob(base64Data);
                            const byteNumbers = new Array(byteCharacters.length);
                            for (let i = 0; i < byteCharacters.length; i++) {
                                byteNumbers[i] = byteCharacters.charCodeAt(i);
                            }
                            const byteArray = new Uint8Array(byteNumbers);
                            const blob = new Blob([byteArray], { type: mimeType });
                            const blobUrl = URL.createObjectURL(blob);
                            resolve(blobUrl);
                        } catch (e) {
                            console.error('二进制数据解析失败:', e);
                            reject(new Error('数据解析失败'));
                        }
                    } else {
                        reject(new Error(`获取失败: ${statusCode}`));
                    }
                };
                
                try {
                    AndroidShell.fetchBinaryData(url, callbackName);
                } catch (e) {
                    delete window[callbackName];
                    console.error('调用 fetchBinaryData 失败:', e);
                    reject(e);
                }
            });
        }

        // 清理URL字符串：去除前后空格、反引号、单双引号
        function cleanUrl(url) {

        // 解析音乐搜索结果
        function parseMusicResult(data) {
            // 根据实际返回格式解析
            if (Array.isArray(data)) {
                return data.map((item, index) => ({
                    id: item.id || `song_${index}`,
                    name: item.name || item.songname || item.title || '未知歌曲',
                    artist: item.artist || item.singer || item.author || '未知歌手',
                    url: item.url || item.link || item.mp3 || '',
                    cover: item.cover || item.pic || item.img || item.albumPic || '',
                    duration: item.duration || item.time || '0:00'
                }));
            }
            
            // 如果是对象，尝试找到歌曲数组
            if (typeof data === 'object' && data !== null) {
                const possibleArrays = ['songs', 'list', 'data', 'result', 'music'];
                for (const key of possibleArrays) {
                    if (Array.isArray(data[key])) {
                        return parseMusicResult(data[key]);
                    }
                }
            }
            
            return [];
        }
        
        // 解析歌词
        function parseLyrics(lrcText) {
            if (!lrcText) return [];
            
            const lines = lrcText.split('\n');
            const lyrics = [];
            
            const timeRegex = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
            
            for (const line of lines) {
                const match = line.match(timeRegex);
                if (match) {
                    const minutes = parseInt(match[1]);
                    const seconds = parseInt(match[2]);
                    const milliseconds = parseInt(match[3].padEnd(3, '0'));
                    const text = match[4].trim();
                    
                    const time = minutes * 60 + seconds + milliseconds / 1000;
                    
                    if (text) {
                        lyrics.push({ time, text });
                    }
                }
            }
            
            return lyrics.sort((a, b) => a.time - b.time);
        }
        
        // 显示歌词
        function displayLyrics(lrcText) {
            const lyricsList = document.getElementById('lyricsList');
            
            if (!lrcText) {
                lyricsList.innerHTML = '<div class="lyric-line active">暂无歌词</div>';
                return;
            }
            
            const lyrics = parseLyrics(lrcText);
            
            if (lyrics.length === 0) {
                lyricsList.innerHTML = '<div class="lyric-line active">暂无歌词</div>';
                return;
            }
            
            lyricsList.innerHTML = lyrics.map((line, index) => 
                `<div class="lyric-line" data-time="${line.time}" data-index="${index}">${line.text}</div>`
            ).join('');
            
            // 保存歌词数据用于同步滚动
            window.currentLyrics = lyrics;
            window.currentLyricIndex = -1;
        }

                if (currentTime >= lyrics[i].time) {

            if (activeIndex !== window.currentLyricIndex && activeIndex >= 0) {

        async function playSong(index) {
            if (index < 0 || index >= currentSongs.length) return;
            
            currentSongIndex = index;
            playingPlaylist = currentPlaylist; // 【关键】记录当前播放歌曲所属的歌单
            const song = currentSongs[index];
            const audio = document.getElementById('audioPlayer');
            
            // 如果没有播放链接或歌词，先获取
            if (!song.url || !song.lrc) {
                showToast('正在获取歌曲信息...');
                const detail = await getSongDetail(song.name, song.n);
                if (detail && detail.url) {
                    song.url = detail.url;
                    song.cover = detail.cover || song.cover;
                    song.duration = detail.duration || song.duration;
                    song.lrc = detail.lrc || ''; // 保存歌词
                    
                    // 同时更新 playlists 中对应的歌曲
                    for (const playlistId in playlists) {
                        const playlistSongs = playlists[playlistId].songs;
                        const playlistSongIndex = playlistSongs.findIndex(s => s.id === song.id);
                        if (playlistSongIndex !== -1) {
                            playlistSongs[playlistSongIndex].url = song.url;
                            playlistSongs[playlistSongIndex].cover = song.cover;
                            playlistSongs[playlistSongIndex].duration = song.duration;
                            playlistSongs[playlistSongIndex].lrc = song.lrc;
                        }
                    }
                    
                    // 保存更新后的歌曲信息到 IndexedDB
                    await savePlaylists();
                    console.log('歌曲信息已保存，包括歌词:', song.lrc ? '有歌词' : '无歌词');
                    
                    // 显示歌词
                    if (song.lrc) {
                        displayLyrics(song.lrc);
                    }
                } else {
                    showToast('无法获取播放链接');
                    return;
                }
            } else if (song.lrc) {
                // 如果已经有歌词，直接显示
                displayLyrics(song.lrc);
            }
            
            // 更新音频源
            if (song.url) {
                showToast('正在加载音频...');
                const audioUrl = cleanUrl(song.url);
                console.log('[playSong] 播放URL:', audioUrl);

                // 在 APP 环境中使用原生播放器
                if (isAndroidApp() && AndroidShell.playAudio) {
                    // 使用原生 MediaPlayer 播放 - 原生播放器支持HTTP/HTTPS
                    console.log('[playSong] 调用原生播放器:', audioUrl);
                    AndroidShell.playAudio(audioUrl);
                    isPlaying = true;
                    updatePlayerUI();
                    // 启动进度轮询
                    startNativeProgressPolling();
                    // 通知父页面音乐开始播放
                    if (window.parent !== window) {
                        window.parent.postMessage({ type: 'musicPlaying' }, '*');
                    }
                } else {
                    // 浏览器环境使用 HTML5 Audio
                    // 注意：现代浏览器通常不允许在HTTPS页面中加载HTTP音频（混合内容策略）
                    // 如果音频是HTTP而页面是HTTPS，播放会失败
                    // 解决方案：
                    // 1. 使用代理服务器转发HTTP音频为HTTPS
                    // 2. 降级到HTTP页面（不推荐）
                    // 3. 使用原生播放器（Android WebView中已实现）
                    console.log('[playSong] 浏览器环境播放:', audioUrl);
                    
                    audio.src = audioUrl;
                    audio.crossOrigin = 'anonymous';

                    audio.play().then(() => {
                        isPlaying = true;
                        updatePlayerUI();
                        if (window.parent !== window) {
                            window.parent.postMessage({ type: 'musicPlaying' }, '*');
                        }
                    }).catch(err => {
                        console.error('播放失败:', err);
                        showToast('播放失败，请重试');
                    });
                }
            } else {
                showToast('暂无播放链接');
            }
            
            // 保存当前歌曲信息到localStorage（供一起听歌功能使用）
            try {
                localStorage.setItem('musicCurrentSong', JSON.stringify({
                    name: song.name,
                    artist: song.artist,
                    cover: song.cover,
                    id: song.id
                }));

            renderSongsList(); // 更新播放状态样式

            const playerCover = document.getElementById('playerCover');
            const fullscreenCover = document.getElementById('fullscreenCover');
            
            const playIcon = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;
            const pauseIcon = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`;
            
            playBtn.innerHTML = isPlaying ? pauseIcon : playIcon;
            fullscreenPlayBtn.innerHTML = isPlaying ? pauseIcon : playIcon;
            
            // 更新列表中的播放状态
            renderSongsList();
        }
        
        // 获取播放列表的歌曲（根据 playingPlaylist）
        function getPlayingSongs() {
            if (playingPlaylist === 'all') {
                let songs = [];
                for (const playlist of Object.values(playlists)) {
                    songs = songs.concat(playlist.songs);
                }
                return songs;
            } else if (playlists[playingPlaylist]) {
                return playlists[playingPlaylist].songs;
            }
            return currentSongs; // 降级使用当前歌曲列表
        }
        
        function playNext() {
            const songs = getPlayingSongs();
            if (songs.length === 0) return;
            
            let nextIndex;
            if (playMode === 'random') {
                nextIndex = Math.floor(Math.random() * songs.length);
            } else if (playMode === 'single') {
                // 单曲循环：重新播放当前歌曲
                nextIndex = currentSongIndex;
            } else {
                // 列表循环：在 playingPlaylist 内循环
                nextIndex = (currentSongIndex + 1) % songs.length;
            }
            
            // 确保 currentSongs 与 playingPlaylist 一致
            currentSongs = songs;
            playSong(nextIndex);
        }
        
        function playPrev() {
            const songs = getPlayingSongs();
            if (songs.length === 0) return;
            
            let prevIndex;
            if (playMode === 'random') {
                prevIndex = Math.floor(Math.random() * songs.length);
            } else if (playMode === 'single') {
                // 单曲循环：重新播放当前歌曲
                prevIndex = currentSongIndex;
            } else {
                // 列表循环：在 playingPlaylist 内循环
                prevIndex = (currentSongIndex - 1 + songs.length) % songs.length;
            }
            
            // 确保 currentSongs 与 playingPlaylist 一致
            currentSongs = songs;
            playSong(prevIndex);
        }
        
        function onSongEnded() {
            if (playMode === 'single') {
                // 单曲循环：重新播放当前歌曲
                const audio = document.getElementById('audioPlayer');
                audio.currentTime = 0;
                audio.play();
            } else {
                playNext();
            }
        }
        
        function togglePlayMode() {
            const modes = ['list', 'random', 'single'];
            const currentIndex = modes.indexOf(playMode);
            playMode = modes[(currentIndex + 1) % modes.length];
            
            const icons = {
                'list': '<path d="M17 2.1l4 4-4 4M3 12.2v-2a4 4 0 014-4h12.8M7 21.9l-4-4 4-4M21 11.8v2a4 4 0 01-4 4H4.2"/>',
                'random': '<path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>',
                'single': '<path d="M17 2.1l4 4-4 4M3 12.2v-2a4 4 0 014-4h12.8M7 21.9l-4-4 4-4M21 11.8v2a4 4 0 01-4 4H4.2"/><circle cx="12" cy="12" r="3"/>'
            };
            
            document.getElementById('playModeIcon').innerHTML = icons[playMode];
            
            const modeNames = { 'list': '列表循环', 'random': '随机播放', 'single': '单曲循环' };
            showToast(modeNames[playMode]);
        }
        
        function updateProgress() {
            const audio = document.getElementById('audioPlayer');
            if (!audio.duration) return;
            
            const progress = (audio.currentTime / audio.duration) * 100;
            document.getElementById('playerProgressBar').style.width = progress + '%';
            document.getElementById('progressCurrent').style.width = progress + '%';
            
            document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
            
            // 更新歌词高亮
            updateLyricHighlight(audio.currentTime);
            
            // 更新桌面歌词逐字进度
            updateDesktopLyricsProgress(audio.currentTime);
        }
        
        function updateDuration() {
            const audio = document.getElementById('audioPlayer');
            document.getElementById('totalTime').textContent = formatTime(audio.duration);
        }
        
        function seekTo(event) {
            const audio = document.getElementById('audioPlayer');
            if (!audio.duration) return;
            
            const rect = event.currentTarget.getBoundingClientRect();
            const percent = (event.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        }
        
        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // ==================== 全屏播放器 ====================
        function openFullscreenPlayer() {
            document.getElementById('fullscreenPlayer').classList.add('show');
        }
        
        function closeFullscreenPlayer() {
            document.getElementById('fullscreenPlayer').classList.remove('show');
        }
        
        function togglePlaylist() {
            closeFullscreenPlayer();
        }
        
        // ==================== 桌面歌词功能 ====================
        let desktopLyricsEnabled = false;
        
        // 切换桌面歌词显示
        function toggleDesktopLyrics() {
            desktopLyricsEnabled = !desktopLyricsEnabled;
            const desktopLyrics = document.getElementById('desktopLyrics');
            const toggleBtn = document.getElementById('desktopLyricsToggle');

            if (desktopLyricsEnabled) {
                desktopLyrics.style.display = 'block';
                toggleBtn.classList.add('active');
                updateDesktopLyrics();
            } else {
                desktopLyrics.style.display = 'none';
                toggleBtn.classList.remove('active');
            }

            // 保存状态
            saveToDB('settings', 'desktopLyricsEnabled', desktopLyricsEnabled);
        }

        // 关闭桌面歌词
        function closeDesktopLyrics() {
            desktopLyricsEnabled = false;
            const desktopLyrics = document.getElementById('desktopLyrics');
            const toggleBtn = document.getElementById('desktopLyricsToggle');
            const closeBtn = document.getElementById('lyricsCloseBtn');

            desktopLyrics.style.display = 'none';
            toggleBtn.classList.remove('active');
            closeBtn.classList.remove('show');

            // 保存状态
            saveToDB('settings', 'desktopLyricsEnabled', false);
        }

        // 长按检测
        let longPressTimer = null;
        let isLongPress = false;
        const LONG_PRESS_DURATION = 600; // 长按触发时间（毫秒）

        function initLyricsLongPress() {
            console.log('【歌词长按】初始化开始');

            // 鼠标/触摸开始 - 使用事件委托
            function onPressStart(e) {
                const desktopLyrics = document.getElementById('desktopLyrics');
                const closeBtn = document.getElementById('lyricsCloseBtn');

                // 检查点击是否在歌词区域内
                if (!desktopLyrics || !desktopLyrics.contains(e.target)) {
                    return;
                }

                // 如果点击的是关闭按钮，不处理
                if (closeBtn && (e.target === closeBtn || (e.target.nodeType === 1 && closeBtn.contains(e.target)))) {
                    return;
                }

                isLongPress = false;
                desktopLyrics.classList.remove('long-press');

                // 清除之前的定时器
                if (longPressTimer) {
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                }

                longPressTimer = setTimeout(() => {
                    isLongPress = true;
                    desktopLyrics.classList.add('long-press');
                    if (closeBtn) {
                        closeBtn.classList.add('show');
                    }

                    // 触发震动反馈（如果支持）
                    if (navigator.vibrate) {
                        navigator.vibrate(50);
                    }

                    console.log('【歌词长按】长按触发，显示关闭按钮');
                }, LONG_PRESS_DURATION);
            }

            // 鼠标/触摸结束
            function onPressEnd(e) {
                const closeBtn = document.getElementById('lyricsCloseBtn');

                if (longPressTimer) {
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                }

                // 如果不是长按，隐藏关闭按钮
                if (!isLongPress && closeBtn) {
                    closeBtn.classList.remove('show');
                }

                const desktopLyrics = document.getElementById('desktopLyrics');
                if (desktopLyrics) {
                    desktopLyrics.classList.remove('long-press');
                }
            }

            // 鼠标/触摸移动（取消长按）
            function onPressMove(e) {
                if (longPressTimer) {
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                }
            }

            // 使用事件委托绑定到 document
            document.addEventListener('mousedown', onPressStart);
            document.addEventListener('mouseup', onPressEnd);
            document.addEventListener('mousemove', onPressMove);

            // 触摸事件
            document.addEventListener('touchstart', onPressStart, { passive: true });
            document.addEventListener('touchend', onPressEnd);
            document.addEventListener('touchcancel', onPressEnd);
            document.addEventListener('touchmove', onPressMove, { passive: true });

            // 点击其他地方隐藏关闭按钮
            document.addEventListener('click', (e) => {
                const desktopLyrics = document.getElementById('desktopLyrics');
                const closeBtn = document.getElementById('lyricsCloseBtn');
                if (closeBtn && desktopLyrics && !desktopLyrics.contains(e.target)) {
                    closeBtn.classList.remove('show');
                }
            });

            // 阻止歌词区域的默认上下文菜单
            document.addEventListener('contextmenu', (e) => {
                const desktopLyrics = document.getElementById('desktopLyrics');
                if (desktopLyrics && desktopLyrics.contains(e.target)) {
                    e.preventDefault();
                }
            });

            console.log('【歌词长按】初始化完成');
        }
        
        // 当前歌词行的开始时间和持续时间（用于逐字动效）
        let currentLineStartTime = 0;
        let currentLineDuration = 0;
        window.currentLineText = '';
        let currentCharIndex = 0;
        
        // 向父页面发送歌词更新消息
        function sendLyricsToParent(lyricText) {
            console.log('【一起听歌】sendLyricsToParent被调用，歌词:', lyricText);
            if (window.parent !== window) {
                window.parent.postMessage({
                    type: 'lyricsUpdate',
                    lyricText: lyricText
                }, '*');
                console.log('【一起听歌】已发送lyricsUpdate消息');
            } else {
                console.log('【一起听歌】无法发送lyricsUpdate：window.parent === window');
            }
        }
        
        // 向父页面发送逐字进度消息
        function sendLyricsProgressToParent(currentCharIdx, totalChars) {
            if (window.parent !== window) {
                window.parent.postMessage({
                    type: 'lyricsProgress',
                    progress: {
                        currentCharIndex: currentCharIdx,
                        totalChars: totalChars
                    }
                }, '*');
            }
        }
        
        // 更新桌面歌词 - 酷狗风格逐字动效
        function updateDesktopLyrics() {
            const desktopLyricsText = document.getElementById('desktopLyricsText');
            
            if (!window.currentLyrics || window.currentLyrics.length === 0) {
                desktopLyricsText.innerHTML = '<span class="lyric-char">暂无歌词</span>';
                window.currentLineText = '暂无歌词';
                sendLyricsToParent('暂无歌词');
                return;
            }
            
            const currentIndex = window.currentLyricIndex || 0;
            const lyric = window.currentLyrics[currentIndex];
            
            if (lyric && lyric.text) {
                // 计算当前行的持续时间
                const nextLyric = window.currentLyrics[currentIndex + 1];
                currentLineStartTime = lyric.time;
                currentLineDuration = nextLyric ? (nextLyric.time - lyric.time) : 3;
                window.currentLineText = lyric.text;
                currentCharIndex = 0;
                
                // 将歌词文本拆分成单个字符，每个字符包装在span中
                const chars = lyric.text.split('');
                desktopLyricsText.innerHTML = chars.map((char, index) => 
                    `<span class="lyric-char" data-index="${index}">${char}</span>`
                ).join('');
                
                // 向父页面发送歌词更新
                sendLyricsToParent(lyric.text);
            } else {
                desktopLyricsText.innerHTML = '<span class="lyric-char">暂无歌词</span>';
                window.currentLineText = '暂无歌词';
                sendLyricsToParent('暂无歌词');
            }
        }
        
        // 更新桌面歌词逐字进度
        function updateDesktopLyricsProgress(currentTime) {
            if (!window.currentLyrics || window.currentLyrics.length === 0) return;
            
            const currentIndex = window.currentLyricIndex || 0;
            const lyric = window.currentLyrics[currentIndex];
            if (!lyric || !lyric.text) return;
            
            // 只在iframe内且桌面歌词启用时更新本地显示
            if (desktopLyricsEnabled) {
                const chars = document.querySelectorAll('.desktop-lyrics-text .lyric-char');
                if (chars.length > 0) {
                    const lineProgress = currentTime - lyric.time;
                    const charCount = lyric.text.length;
                    const charDuration = currentLineDuration / charCount;
                    
                    chars.forEach((char, index) => {
                        const charStartTime = index * charDuration;
                        const charEndTime = (index + 1) * charDuration;
                        
                        if (lineProgress >= charEndTime) {
                            char.classList.remove('active');
                            char.classList.add('played');
                        } else if (lineProgress >= charStartTime) {
                            char.classList.remove('played');
                            char.classList.add('active');
                        } else {
                            char.classList.remove('active', 'played');
                        }
                    });
                }
            }
            
            // 计算当前字符索引并发送给父页面
            const lineProgress = currentTime - lyric.time;
            const charCount = lyric.text.length;
            const charDuration = currentLineDuration / charCount;
            const newCharIndex = Math.min(Math.floor(lineProgress / charDuration), charCount - 1);
            
            if (newCharIndex !== currentCharIndex || newCharIndex >= 0) {
                currentCharIndex = newCharIndex;
                sendLyricsProgressToParent(currentCharIndex, charCount);
            }
        }
        
        // 加载桌面歌词状态
        async function loadDesktopLyricsState() {
            try {
                const enabled = await getFromDB('settings', 'desktopLyricsEnabled');
                if (enabled) {
                    desktopLyricsEnabled = true;
                    const desktopLyrics = document.getElementById('desktopLyrics');
                    const toggleBtn = document.getElementById('desktopLyricsToggle');
                    desktopLyrics.style.display = 'block';
                    toggleBtn.classList.add('active');
                }
            } catch (error) {
                console.error('加载桌面歌词状态失败:', error);
            }
        }
        
        // ==================== 工具函数 ====================
        function goBack() {
            // 如果在 iframe 中，通知父页面关闭
            if (window.parent !== window) {
                window.parent.postMessage('closeMusicPlayer', '*');
            } else {
                window.history.back();
            }
        }
        
        // 监听来自父页面的消息
        window.addEventListener('message', function(event) {
            if (event.data === 'showDebugDialog') {
                showDebugDialog();
            }
        });
        
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
        
        // 添加歌曲到歌单
        async function addToPlaylist(songIndex) {
            if (songIndex < 0 || songIndex >= currentSongs.length) return;
            
            const song = currentSongs[songIndex];
            
            // 创建选择歌单弹窗
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay show';
            overlay.style.zIndex = '2500';
            
            // 获取所有可添加的歌单（排除搜索结果）
            const availablePlaylists = Object.entries(playlists).filter(([id, p]) => id !== 'search');
            
            let playlistHtml = '';
            if (availablePlaylists.length === 0) {
                playlistHtml = '<div style="text-align: center; color: #999; padding: 20px;">暂无歌单，请先创建歌单</div>';
            } else {
                playlistHtml = availablePlaylists.map(([id, playlist]) => `
                    <div class="playlist-select-item" data-id="${id}" style="
                        padding: 12px 16px;
                        margin: 8px 0;
                        background: rgba(255,255,255,0.6);
                        border-radius: 12px;
                        cursor: pointer;
                        display: flex;
                        align-items: center;
                        gap: 10px;
                        transition: all 0.3s;
                    " onmouseover="this.style.background='rgba(212,165,116,0.2)'" onmouseout="this.style.background='rgba(255,255,255,0.6)'">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#D4A574" stroke-width="2">
                            <path d="M9 18V5l12-2v13M9 18c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2zm12-2c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2z"/>
                        </svg>
                        <span style="flex: 1; color: #5C4A3A;">${playlist.name}</span>
                        <span style="color: #999; font-size: 12px;">${playlist.songs.length}首</span>
                    </div>
                `).join('');
            }
            
            overlay.innerHTML = `
                <div class="modal-content" style="max-width: 300px;" onclick="event.stopPropagation()">
                    <div class="modal-title">添加到歌单</div>
                    <div style="max-height: 300px; overflow-y: auto; margin-bottom: 16px;">
                        ${playlistHtml}
                    </div>
                    <div class="modal-actions">
                        <button class="modal-btn cancel" onclick="this.closest('.modal-overlay').remove()">取消</button>
                        <button class="modal-btn confirm" onclick="this.closest('.modal-overlay').remove(); showCreatePlaylistModal();">新建歌单</button>
                    </div>
                </div>
            `;
            
            // 点击歌单项添加歌曲
            overlay.querySelectorAll('.playlist-select-item').forEach(item => {
                item.addEventListener('click', async () => {
                    const playlistId = item.dataset.id;
                    
                    // 检查歌曲是否已存在
                    const exists = playlists[playlistId].songs.some(s => s.id === song.id);
                    if (exists) {
                        showToast('歌曲已存在于该歌单');
                        overlay.remove();
                        return;
                    }
                    
                    // 添加歌曲到歌单
                    playlists[playlistId].songs.push({
                        ...song,
                        addedTime: Date.now()
                    });
                    
                    // 保存到 IndexedDB
                    await savePlaylists();
                    
                    showToast(`已添加到 ${playlists[playlistId].name}`);
                    overlay.remove();
                    
                    // 如果当前显示的是该歌单，刷新列表
                    if (currentPlaylist === playlistId) {
                        renderSongsList();
                    }
                });
            });
            
            document.body.appendChild(overlay);
        }
        
        // 删除歌曲
        async function deleteSong(songIndex) {
            if (songIndex < 0 || songIndex >= currentSongs.length) return;
            
            const song = currentSongs[songIndex];
            
            // 确认删除
            if (!confirm(`确定要删除《${song.name}》吗？`)) {
                return;
            }
            
            // 从当前歌单中删除
            if (currentPlaylist === 'all') {
                // 如果是"全部"标签，需要从所有歌单中删除这首歌
                for (const playlistId in playlists) {
                    if (playlists[playlistId].songs) {
                        playlists[playlistId].songs = playlists[playlistId].songs.filter(s => s.id !== song.id);
                    }
                }
            } else if (playlists[currentPlaylist]) {
                // 从当前歌单中删除
                playlists[currentPlaylist].songs = playlists[currentPlaylist].songs.filter((s, idx) => idx !== songIndex);
            }
            
            // 保存到 IndexedDB
            await savePlaylists();
            
            // 更新当前歌曲索引
            if (currentSongIndex === songIndex) {
                // 如果删除的是当前播放的歌曲，停止播放
                isPlaying = false;
                currentSongIndex = -1;
                updatePlayerUI();
            } else if (currentSongIndex > songIndex) {
                // 如果删除的歌曲在当前播放歌曲之前，调整索引
                currentSongIndex--;
            }
            
            // 刷新列表
            renderSongsList();
            
            showToast(`已删除《${song.name}》`);
        }
        
        function showPlaylistManager() {
            showToast('歌单管理功能开发中');
        }
        
        // ==================== 歌词功能（模拟）====================
        function updateLyrics() {
            // 这里可以实现歌词同步显示
            // 需要解析歌词文件并根据当前播放时间更新
        }
    </script>
