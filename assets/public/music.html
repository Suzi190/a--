<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>音乐 - 佳景</title>
    
    <!-- PWA Meta 标签 -->
    <meta name="theme-color" content="#FFF8DC">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <!-- 平方长安体字体 -->
    <link href="https://fontsapi.zeoseven.com/492/main/result.css" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: '平方长安体', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #FFFEF0 0%, #FFF8DC 50%, #FFF5D4 100%);
            min-height: 100vh;
            color: #5C4A3A;
            overflow-x: hidden;
        }
        
        /* 顶部状态栏占位 */
        .status-bar-placeholder {
            height: env(safe-area-inset-top, 44px);
            min-height: 44px;
            background: transparent;
        }
        
        /* 顶部导航栏 */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 254, 240, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 10px 16px;
            border-bottom: 1px solid rgba(210, 180, 140, 0.2);
        }
        
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        
        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(210, 180, 140, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .back-btn:hover {
            background: rgba(210, 180, 140, 0.4);
            transform: scale(1.05);
        }
        
        .back-btn svg {
            width: 20px;
            height: 20px;
            stroke: #8B7355;
        }
        
        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: #6B5344;
            letter-spacing: 2px;
        }
        
        .header-actions {
            display: flex;
            gap: 8px;
        }
        
        .header-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(210, 180, 140, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .header-btn:hover {
            background: rgba(210, 180, 140, 0.4);
        }
        
        .header-btn svg {
            width: 18px;
            height: 18px;
            stroke: #8B7355;
        }
        
        /* 搜索框 */
        .search-container {
            position: relative;
            margin-bottom: 8px;
        }
        
        .search-box {
            width: 100%;
            height: 44px;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(210, 180, 140, 0.3);
            border-radius: 22px;
            padding: 0 48px 0 44px;
            font-size: 15px;
            color: #5C4A3A;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        
        .search-box::placeholder {
            color: #B8A080;
        }
        
        .search-box:focus {
            border-color: #D4A574;
            box-shadow: 0 0 0 3px rgba(212, 165, 116, 0.2);
        }
        
        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            stroke: #B8A080;
        }
        
        .search-btn {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #D4A574 0%, #C49A6C 100%);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .search-btn:hover {
            transform: translateY(-50%) scale(1.05);
            box-shadow: 0 4px 12px rgba(212, 165, 116, 0.4);
        }
        
        .search-btn svg {
            width: 16px;
            height: 16px;
            stroke: white;
        }
        
        /* 轮播图区域 */
        .carousel-section {
            padding: 16px;
        }
        
        .carousel-container {
            position: relative;
            width: 100%;
            height: 180px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(139, 115, 85, 0.15);
            border: 3px solid rgba(210, 180, 140, 0.4);
            background: linear-gradient(135deg, #FFF5E6 0%, #FFE4C4 100%);
        }
        
        .carousel-slides {
            display: flex;
            transition: transform 0.5s ease;
            height: 100%;
        }
        
        .carousel-slide {
            min-width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .carousel-slide video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .carousel-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #B8A080;
            font-size: 14px;
        }
        
        .carousel-placeholder svg {
            width: 48px;
            height: 48px;
            stroke: #D4A574;
            margin-bottom: 8px;
        }
        
        .carousel-dots {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
        }
        
        .carousel-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .carousel-dot.active {
            width: 24px;
            border-radius: 4px;
            background: white;
        }
        
        .carousel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: all 0.3s ease;
        }
        
        .carousel-container:hover .carousel-nav {
            opacity: 1;
        }
        
        .carousel-nav.prev {
            left: 12px;
        }
        
        .carousel-nav.next {
            right: 12px;
        }
        
        .carousel-nav svg {
            width: 16px;
            height: 16px;
            stroke: #8B7355;
        }
        
        /* 轮播图管理按钮 */
        .carousel-manage-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 10;
        }
        
        .carousel-container:hover .carousel-manage-btn {
            opacity: 1;
        }
        
        .carousel-manage-btn svg {
            width: 18px;
            height: 18px;
            stroke: #8B7355;
        }
        
        /* ========== 一起听歌功能样式 ========== */
        .listen-together-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #FF6B9D 0%, #FF8E53 100%);
            border: none;
            border-radius: 20px;
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.3);
        }
        
        .listen-together-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 157, 0.4);
        }
        
        .listen-together-btn.active {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);
        }
        
        .listen-together-btn svg {
            width: 16px;
            height: 16px;
            stroke: white;
        }
        
        /* 一起听歌状态显示 */
        .listening-together-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            background: linear-gradient(135deg, #FFF5E6 0%, #FFE4C4 100%);
            position: relative;
            overflow: hidden;
        }
        
        .listening-avatars {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 16px;
        }
        
        .listening-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid rgba(255, 107, 157, 0.5);
            object-fit: cover;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .listening-avatar.user-avatar {
            border-color: rgba(212, 165, 116, 0.8);
        }
        
        /* 心电图动画 */
        .heartbeat-line {
            width: 80px;
            height: 40px;
            position: relative;
        }
        
        .heartbeat-line svg {
            width: 100%;
            height: 100%;
        }
        
        .heartbeat-line path {
            stroke: #FF6B9D;
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            animation: heartbeat 1.5s ease-in-out infinite;
        }
        
        @keyframes heartbeat {
            0%, 100% { opacity: 0.6; stroke-width: 2; }
            50% { opacity: 1; stroke-width: 3; }
        }
        
        .listening-stats {
            text-align: center;
            color: #6B5344;
        }
        
        .listening-stats .time {
            font-size: 24px;
            font-weight: 700;
            color: #FF6B9D;
            margin-bottom: 4px;
        }
        
        .listening-stats .label {
            font-size: 12px;
            color: #B8A080;
        }
        
        .listening-character-name {
            font-size: 14px;
            color: #6B5344;
            font-weight: 600;
            margin-top: 8px;
        }
        
        /* 角色选择弹窗 */
        .character-select-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
        }
        
        .character-select-content {
            background: linear-gradient(135deg, #FFFEF0 0%, #FFF8DC 100%);
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            overflow: hidden;
            border: 2px solid rgba(210, 180, 140, 0.3);
        }
        
        .character-select-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid rgba(210, 180, 140, 0.2);
        }
        
        .character-select-header h3 {
            margin: 0;
            color: #6B5344;
            font-size: 18px;
        }
        
        .character-select-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(210, 180, 140, 0.2);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #8B7355;
            font-size: 18px;
        }
        
        .character-list {
            padding: 16px;
            max-height: 60vh;
            overflow-y: auto;
        }
        
        .character-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 8px;
            border: 2px solid transparent;
        }
        
        .character-item:hover {
            background: rgba(210, 180, 140, 0.15);
        }
        
        .character-item.selected {
            border-color: #FF6B9D;
            background: rgba(255, 107, 157, 0.1);
        }
        
        .character-item-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(210, 180, 140, 0.3);
        }
        
        .character-item-info {
            flex: 1;
        }
        
        .character-item-name {
            font-size: 15px;
            font-weight: 600;
            color: #6B5344;
            margin-bottom: 2px;
        }
        
        .character-item-time {
            font-size: 12px;
            color: #B8A080;
        }
        
        .character-item-listening {
            padding: 4px 10px;
            background: linear-gradient(135deg, #FF6B9D 0%, #FF8E53 100%);
            color: white;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }
        
        /* 轮播图弹窗 */
        .carousel-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
        }
        
        .carousel-modal-content {
            background: linear-gradient(135deg, #FFFEF0 0%, #FFF8DC 100%);
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            overflow: hidden;
            border: 2px solid rgba(210, 180, 140, 0.3);
        }
        
        .carousel-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid rgba(210, 180, 140, 0.2);
        }
        
        .carousel-modal-header h3 {
            margin: 0;
            color: #6B5344;
            font-size: 18px;
        }
        
        .carousel-modal-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: rgba(210, 180, 140, 0.2);
            color: #8B7355;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .carousel-modal-body {
            padding: 20px;
            overflow-y: auto;
            max-height: 60vh;
        }
        
        .carousel-options {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .carousel-option {
            flex: 1;
            min-width: 80px;
            padding: 16px 12px;
            border: 2px dashed rgba(210, 180, 140, 0.4);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .carousel-option:hover {
            background: rgba(210, 180, 140, 0.1);
            border-color: rgba(210, 180, 140, 0.6);
        }
        
        .carousel-option svg {
            width: 28px;
            height: 28px;
            stroke: #D4A574;
        }
        
        .carousel-option span {
            font-size: 12px;
            color: #8B7355;
        }
        
        .carousel-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .carousel-list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 10px;
            border: 1px solid rgba(210, 180, 140, 0.2);
        }
        
        .carousel-list-item img,
        .carousel-list-item video {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
        }
        
        .carousel-list-item-info {
            flex: 1;
            font-size: 14px;
            color: #6B5344;
        }
        
        .carousel-list-item-delete {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* 歌单区域 */
        .playlist-section {
            padding: 0 16px 120px;
        }
        
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #6B5344;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(180deg, #D4A574 0%, #C49A6C 100%);
            border-radius: 2px;
        }
        
        .section-actions {
            display: flex;
            gap: 8px;
        }
        
        .section-btn {
            padding: 6px 14px;
            border-radius: 16px;
            border: 1px solid rgba(210, 180, 140, 0.4);
            background: rgba(255, 255, 255, 0.6);
            color: #8B7355;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        
        .section-btn:hover {
            background: rgba(212, 165, 116, 0.2);
            border-color: #D4A574;
        }
        
        .section-btn.primary {
            background: linear-gradient(135deg, #D4A574 0%, #C49A6C 100%);
            color: white;
            border: none;
        }
        
        .section-btn.primary:hover {
            box-shadow: 0 4px 12px rgba(212, 165, 116, 0.4);
        }
        
        /* 歌单标签 */
        .playlist-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        
        .playlist-tabs::-webkit-scrollbar {
            display: none;
        }
        
        .playlist-tab {
            padding: 8px 18px;
            border-radius: 20px;
            border: 2px solid rgba(210, 180, 140, 0.3);
            background: rgba(255, 255, 255, 0.5);
            color: #8B7355;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            font-family: inherit;
        }
        
        .playlist-tab:hover {
            border-color: #D4A574;
            background: rgba(212, 165, 116, 0.1);
        }
        
        .playlist-tab.active {
            background: linear-gradient(135deg, #D4A574 0%, #C49A6C 100%);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(212, 165, 116, 0.3);
        }
        
        /* 歌曲列表 */
        .songs-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .song-item {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 14px;
            border: 1px solid rgba(210, 180, 140, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .song-item:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateX(4px);
            box-shadow: 0 4px 16px rgba(139, 115, 85, 0.1);
        }
        
        .song-item.playing {
            background: linear-gradient(135deg, rgba(212, 165, 116, 0.15) 0%, rgba(196, 154, 108, 0.1) 100%);
            border-color: rgba(212, 165, 116, 0.4);
        }
        
        .song-number {
            width: 32px;
            text-align: center;
            font-size: 14px;
            color: #B8A080;
            font-weight: 500;
        }
        
        .song-item.playing .song-number {
            color: #D4A574;
        }
        
        .song-cover {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: linear-gradient(135deg, #FFE4C4 0%, #DEB887 100%);
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        
        .song-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .song-cover svg {
            width: 24px;
            height: 24px;
            stroke: #8B7355;
        }
        
        .song-info {
            flex: 1;
            min-width: 0;
        }
        
        .song-name {
            font-size: 15px;
            font-weight: 500;
            color: #5C4A3A;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }
        
        .song-artist {
            font-size: 12px;
            color: #999;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .song-duration {
            font-size: 13px;
            color: #B8A080;
            margin-right: 12px;
        }
        
        .song-actions {
            display: flex;
            gap: 8px;
        }
        
        .song-action-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .song-action-btn:hover {
            background: rgba(210, 180, 140, 0.2);
        }
        
        .song-action-btn svg {
            width: 18px;
            height: 18px;
            stroke: #8B7355;
        }
        
        /* 底部播放器 */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 254, 240, 0.98);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(210, 180, 140, 0.3);
            padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px));
            z-index: 200;
            transform: translateY(0);
            transition: transform 0.3s ease;
        }
        
        .player-bar.hidden {
            transform: translateY(100%);
        }
        
        .player-bar-content {

    <!-- 原生音频播放回调函数 -->
    <script>
        // 原生播放器播放开始回调
        window.onNativeAudioPlay = function(duration) {
            console.log('[JS回调] onNativeAudioPlay被调用, 时长:', duration);
            isPlaying = true;
            updatePlayerUI();
            
            // 更新总时长显示
            if (duration > 0) {
                const totalTimeEl = document.getElementById('totalTime');
                if (totalTimeEl) {
                    totalTimeEl.textContent = formatTime(duration / 1000);
                }
            }
        }
        
        // 调试计数器
        let progressCallbackCount = 0;
        let lastLogTime = 0;
        
        // 原生播放器进度更新回调
        window.onNativeAudioProgress = function(position, duration) {
            // 直接修改全局变量（最简单的方式）
            if (!window.debugCallbackStats) {
                window.debugCallbackStats = { progressCount: 0, lastPosition: 0, lastDuration: 0, lastCallbackTime: 0, startTime: Date.now() };
            }
            window.debugCallbackStats.progressCount++;
            window.debugCallbackStats.lastPosition = position;
            window.debugCallbackStats.lastDuration = duration;
            window.debugCallbackStats.lastCallbackTime = Date.now();
            
            // position 和 duration 是毫秒，转换为秒
            const currentTimeSec = position / 1000;
            const durationSec = duration / 1000;
            
            // 首次回调显示alert
            if (window.debugCallbackStats.progressCount === 1) {
                alert('[调试] onNativeAudioProgress首次被调用! position:' + position + 'ms');
            }
            
            // 每10次回调显示一次toast
            if (window.debugCallbackStats.progressCount % 10 === 0) {
                showToast('JS回调第' + window.debugCallbackStats.progressCount + '次 position:' + position);
            }
            
            // 调试日志（每1秒输出一次，避免刷屏）
            progressCallbackCount++;
            const now = Date.now();
            if (now - lastLogTime > 1000) {
                console.log(`[JS回调] onNativeAudioProgress 回调次数:${progressCallbackCount}, position:${position}ms, duration:${duration}ms`);
                lastLogTime = now;
                progressCallbackCount = 0;
            }
            
            // 更新进度条
            const progressFill = document.getElementById('progressCurrent');
            const playerProgressBar = document.getElementById('playerProgressBar');
            const currentTimeEl = document.getElementById('currentTime');
            const totalTimeEl = document.getElementById('totalTime');
            
            if (duration > 0) {
                const percent = (position / duration) * 100;
                if (progressFill) {
                    progressFill.style.width = percent + '%';
                }
                if (playerProgressBar) {
                    playerProgressBar.style.width = percent + '%';
                }
            }
            
            if (currentTimeEl) {
                currentTimeEl.textContent = formatTime(currentTimeSec);
            }
            if (totalTimeEl && duration > 0) {
                totalTimeEl.textContent = formatTime(durationSec);
            }
            
            // 更新歌词高亮和滚动
            if (window.currentLyrics && window.currentLyrics.length > 0) {
                updateLyricHighlight(currentTimeSec);
                updateDesktopLyricsProgress(currentTimeSec);
            }

                playRandom();

                            window.debugCallbackStats = { progressCount: 0, lastPosition: 0, lastDuration: 0, lastCallbackTime: 0, startTime: Date.now(), jsFunctionType: '轮询', androidLogs: [] };
                        }
                        window.debugCallbackStats.progressCount++;
                        window.debugCallbackStats.lastPosition = position;
                        window.debugCallbackStats.lastDuration = duration;
                        window.debugCallbackStats.lastCallbackTime = Date.now();
                        
                        // 调用原有的进度更新逻辑
                        updateProgressFromNative(position, duration);
                    } catch (e) {
                        console.error('[轮询] 获取进度失败:', e);
                    }
                }
            }, 500);
        }
        
        // 停止进度轮询
        function stopNativeProgressPolling() {
            if (nativeProgressInterval) {
                clearInterval(nativeProgressInterval);
                nativeProgressInterval = null;
                console.log('[轮询] 停止原生播放器进度轮询');
            }
        }
        
        // 从原生播放器更新进度（替代onNativeAudioProgress）
        function updateProgressFromNative(position, duration) {
            // position 和 duration 是毫秒，转换为秒
            const currentTimeSec = position / 1000;
            const durationSec = duration / 1000;
            
            // 更新进度条
            const progressFill = document.getElementById('progressCurrent');
            const playerProgressBar = document.getElementById('playerProgressBar');
            const currentTimeEl = document.getElementById('currentTime');
            const totalTimeEl = document.getElementById('totalTime');
            
            if (duration > 0) {
                const percent = (position / duration) * 100;
                if (progressFill) {
                    progressFill.style.width = percent + '%';
                }
                if (playerProgressBar) {
                    playerProgressBar.style.width = percent + '%';
                }
            }
            
            if (currentTimeEl) {
                currentTimeEl.textContent = formatTime(currentTimeSec);
            }
            if (totalTimeEl && duration > 0) {
                totalTimeEl.textContent = formatTime(durationSec);
            }
            
            // 更新歌词高亮和滚动
            if (window.currentLyrics && window.currentLyrics.length > 0) {
                updateLyricHighlight(currentTimeSec);
                updateDesktopLyricsProgress(currentTimeSec);
            }

        // ========== 一起听歌功能 ==========
        
        // 一起听歌状态管理
        let listenTogetherState = {
            isListening: false,
            characterId: null,
            characterName: null,
            characterAvatar: null,
            startTime: null,
            timerInterval: null
        };
        
        // 从IndexedDB加载一起听歌状态
        async function loadListenTogetherState() {
            try {
                const saved = await getFromDB('listenTogether', 'state');
                if (saved) {
                    // 恢复状态
                    listenTogetherState.isListening = true;
                    listenTogetherState.characterId = saved.characterId;
                    listenTogetherState.characterName = saved.characterName;
                    listenTogetherState.characterAvatar = saved.characterAvatar;
                    listenTogetherState.startTime = Date.now();
                    
                    // 【关键】优先从SQLite（父页面）获取时间，更可靠
                    let timeMs = 0;
                    try {
                        const sqliteTime = await getTotalListenedTimeFromParent(saved.characterId);
                        if (sqliteTime > 0) {
                            timeMs = sqliteTime;
                            console.log('【一起听歌】从SQLite恢复累计时间:', timeMs, 'ms');
                        }
                    } catch (e) {
                        console.log('【一起听歌】从SQLite获取时间失败，降级到IndexedDB');
                    }
                    
                    // 如果SQLite没有时间，尝试从IndexedDB获取
                    if (timeMs === 0) {
                        const savedTime = await getFromDB('listenTogether', `time_${saved.characterId}`);
                        if (savedTime) {
                            timeMs = parseInt(savedTime);
                            console.log('【一起听歌】从IndexedDB恢复累计时间:', timeMs, 'ms');
                        }
                    }
                    
                    if (timeMs > 0) {
                        listenTogetherState.totalListenedTime = timeMs;
                        characterListenTimeCache[saved.characterId] = timeMs;
                    }
                    
                    // 恢复后启动音乐信息更新
                    startMusicInfoUpdate();
                    startListenTogetherTimer();
                    startAutoSaveTime();

                } else {
                    // 【关键】即使没有状态，也尝试从SQLite加载所有角色的时间
                    console.log('【一起听歌】无保存状态，尝试从SQLite加载时间缓存');
                    await loadAllCharacterListenTimesFromSQLite();
                }
            } catch (e) {
                console.error('加载一起听歌状态失败:', e);
            }

        // 【新增】从SQLite加载所有角色的听歌时间
        async function loadAllCharacterListenTimesFromSQLite() {
            try {
                // 请求父页面发送所有已保存的角色时间
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'getAllListenTimes' }, '*');

                console.error('请求所有角色时间失败:', e);
            }

        // 保存一起听歌状态到IndexedDB
        async function saveListenTogetherState() {
            try {
                await saveToDB('listenTogether', 'state', {
                    characterId: listenTogetherState.characterId,
                    characterName: listenTogetherState.characterName,
                    characterAvatar: listenTogetherState.characterAvatar
                });
            } catch (e) {
                console.error('保存一起听歌状态失败:', e);
            }
        }
        
        // 获取累计听歌时间（从IndexedDB）
        async function getTotalListenedTimeAsync(characterId) {
            if (!characterId) return 0;
            try {
                const saved = await getFromDB('listenTogether', `time_${characterId}`);
                return saved ? parseInt(saved) : 0;
            } catch (e) {
                console.error('获取累计听歌时间失败:', e);
                return 0;
            }
        }
        
        // 角色听歌时间缓存（key: characterId, value: timeMs）
        let characterListenTimeCache = {};
        
        // 从IndexedDB加载所有角色的听歌时间
        async function loadAllCharacterListenTimes() {
            try {
                const transaction = db.transaction(['listenTogether'], 'readonly');
                const store = transaction.objectStore('listenTogether');
                const request = store.getAllKeys();
                
                return new Promise((resolve, reject) => {
                    request.onsuccess = () => {
                        const keys = request.result || [];
                        const timeKeys = keys.filter(key => key.startsWith('time_'));
                        const promises = timeKeys.map(key => getFromDB('listenTogether', key));
                        
                        Promise.all(promises).then(values => {
                            timeKeys.forEach((key, index) => {
                                const characterId = key.replace('time_', '');
                                characterListenTimeCache[characterId] = parseInt(values[index]) || 0;
                            });
                            resolve();
                        });
                    };
                    request.onerror = () => reject(request.error);
                });
            } catch (e) {
                console.error('加载所有角色听歌时间失败:', e);
            }
        }
        
        // 获取累计听歌时间（同步版本，用于显示）
        function getTotalListenedTime(characterId) {
            if (!characterId) return 0;
            // 从缓存中获取该角色的时间
            return characterListenTimeCache[characterId] || 0;
        }
        
        // 【统一存储】保存累计听歌时间（与加号音乐使用相同的localforage存储）
        async function saveTotalListenedTimeAsync(characterId, timeMs) {
            if (!characterId) return;
            try {
                // 更新缓存
                characterListenTimeCache[characterId] = timeMs;
                
                // 【关键】通过postMessage请求父页面保存（与加号音乐完全相同的格式）
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({
                        type: 'saveListenTimeToLocalforage',
                        characterId: characterId,
                        timeMs: timeMs
                    }, '*');
                }
            } catch (e) {
                console.error('保存累计听歌时间失败:', e);
            }
        }
        
        // 保存累计听歌时间（同步版本）
        function saveTotalListenedTime(characterId, timeMs) {
            if (!characterId) return;
            // 更新缓存
            characterListenTimeCache[characterId] = timeMs;
            // 异步保存
            saveTotalListenedTimeAsync(characterId, timeMs);
        }
        
        // 【统一存储】从父页面获取一起听歌时间（与加号音乐统一）
        async function getTotalListenedTimeFromParent(characterId) {
            return new Promise((resolve) => {
                if (!characterId || !window.parent || window.parent === window) {
                    resolve(0);
                    return;
                }
                
                // 设置一次性监听器
                const handler = (event) => {
                    if (event.data && event.data.type === 'listenTimeResponse') {
                        window.removeEventListener('message', handler);
                        resolve(event.data.timeMs || 0);
                    }
                };
                window.addEventListener('message', handler);
                
                // 发送请求
                window.parent.postMessage({
                    type: 'getListenTimeFromLocalforage',
                    characterId: characterId
                }, '*');
                
                // 2秒超时
                setTimeout(() => {
                    window.removeEventListener('message', handler);
                    resolve(0);
                }, 2000);
            });
        }
        
        // 格式化时间（毫秒转为时分秒）
        function formatListenTime(ms) {
            const seconds = Math.floor(ms / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);
            
            if (days > 0) {
                return `${days}天${hours % 24}小时`;
            } else if (hours > 0) {
                return `${hours}小时${minutes % 60}分`;
            } else if (minutes > 0) {
                return `${minutes}分${seconds % 60}秒`;
            } else {
                return `${seconds}秒`;
            }
        }
        
        // 切换一起听歌状态
        function toggleListenTogether() {
            if (listenTogetherState.isListening) {
                // 停止一起听歌
                stopListenTogether();
            } else {
                // 显示角色选择弹窗
                showCharacterSelectModal();
            }
        }

        function showCharacterSelectModal() {

            const characters = getCharacterList();

        // 关闭角色选择弹窗
        function closeCharacterSelectModal() {
            const modal = document.getElementById('characterSelectModal');
            if (modal) modal.remove();
        }
        
        // 存储从父页面获取的角色列表
        let cachedCharacterList = [];
        
        // 获取角色列表（使用postMessage请求父页面）
        function getCharacterList() {
            // 如果有缓存，先返回缓存
            if (cachedCharacterList && cachedCharacterList.length > 0) {
                return cachedCharacterList;
            }
            
            // 尝试从localStorage读取
            try {
                const saved = localStorage.getItem('relationshipData');
                if (saved) {
                    const data = JSON.parse(saved);
                    if (data.wechatChatList) {
                        cachedCharacterList = data.wechatChatList
                            .filter(chat => !chat.isGroupChat)
                            .map(chat => ({
                                id: chat.id,
                                name: chat.remark || chat.name,
                                avatar: chat.avatar
                            }));
                        return cachedCharacterList;
                    }
                }
            } catch (e) {
                console.error('从localStorage获取角色列表失败:', e);
            }
            
            // 尝试通过postMessage请求父页面
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'getCharacterList' }, '*');
            }
            
            return [];
        }
        
        // 监听来自父页面的消息
        window.addEventListener('message', (event) => {
            if (!event.data || !event.data.type) return;
            
            switch (event.data.type) {
                case 'characterList':
                    cachedCharacterList = event.data.characters || [];
                    console.log('【一起听歌】从父页面获取角色列表:', cachedCharacterList.length, '个角色');
                    break;
                case 'userAvatar':
                    cachedUserAvatar = event.data.avatar;
                    console.log('【一起听歌】从父页面获取用户头像');
                    // 如果正在一起听歌，更新显示
                    if (listenTogetherState.isListening) {
                        updateCarouselForListening();
                    }
                    break;
                case 'appData':
                    // 接收APP数据（头像、角色列表等）
                    if (event.data.avatar) {
                        cachedUserAvatar = event.data.avatar;
                    }
                    if (event.data.characters) {
                        cachedCharacterList = event.data.characters;
                    }
                    console.log('【一起听歌】从父页面获取APP数据');
                    break;
                case 'allListenTimesResponse':
                    // 【新增】接收所有角色的听歌时间
                    const times = event.data.times || {};
                    console.log('【一起听歌】从父页面获取所有角色时间:', times);
                    for (const [charId, timeMs] of Object.entries(times)) {
                        characterListenTimeCache[charId] = timeMs;
                    }
                    break;
            }
        });
        
        // 页面加载时请求父页面发送数据
        function requestDataFromParent() {
            if (window.parent && window.parent !== window) {
                console.log('【一起听歌】请求父页面发送数据');
                window.parent.postMessage({ type: 'getAppData' }, '*');
            }
        }
        
        // 页面加载完成后请求数据
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', requestDataFromParent);
        } else {
            requestDataFromParent();
        }
        
        // 选择角色开始一起听歌
        async function selectCharacterForListening(characterId, characterName, characterAvatar) {
            closeCharacterSelectModal();
            
            // 如果之前在和另一个角色听，先停止
            if (listenTogetherState.isListening) {
                stopListenTogether();
            }
            
            // 设置新状态
            listenTogetherState.isListening = true;
            listenTogetherState.characterId = characterId;
            listenTogetherState.characterName = characterName;
            listenTogetherState.characterAvatar = characterAvatar;
            listenTogetherState.startTime = Date.now();
            
            // 保存状态（异步）
            await saveListenTogetherState();
            
            // 启动计时器
            startListenTogetherTimer();
            
            // 启动自动保存时间
            startAutoSaveTime();
            
            // 启动音乐信息更新
            startMusicInfoUpdate();
            
            // 更新UI
            updateListenTogetherUI();
            
            // 更新轮播图显示
            updateCarouselForListening();
            
            showToast(`开始和 ${characterName} 一起听歌`);
        }
        
        // 停止一起听歌
        async function stopListenTogether() {
            if (!listenTogetherState.isListening) return;
            
            // 计算本次听歌时间
            const listenedTime = Date.now() - listenTogetherState.startTime;
            const totalTime = getTotalListenedTime(listenTogetherState.characterId) + listenedTime;
            
            // 【关键】等待保存完成
            await saveTotalListenedTimeAsync(listenTogetherState.characterId, totalTime);
            console.log('【一起听歌】停止时保存时间完成:', totalTime);
            
            // 清除计时器
            if (listenTogetherState.timerInterval) {
                clearInterval(listenTogetherState.timerInterval);
                listenTogetherState.timerInterval = null;
            }
            
            // 停止自动保存时间
            stopAutoSaveTime();
            
            // 停止音乐信息更新
            stopMusicInfoUpdate();
            
            // 重置状态
            listenTogetherState.isListening = false;
            listenTogetherState.startTime = null;
            
            // 保存状态
            await saveListenTogetherState();
            
            // 更新UI
            updateListenTogetherUI();
            
            // 恢复轮播图
            restoreCarousel();
            
            showToast('已停止一起听歌');
        }

        // 获取当前播放歌曲信息（用于聊天API）
        function getCurrentMusicInfo() {
            const currentSong = currentSongIndex >= 0 && currentSongs[currentSongIndex] ? currentSongs[currentSongIndex] : null;
            if (!currentSong) return null;
            
            // 获取当前歌词
            let currentLyric = '';
            if (window.currentLyrics && window.currentLyrics.length > 0) {
                const audio = document.getElementById('audioPlayer');
                const currentTime = audio ? audio.currentTime : 0;
                
                // 找到当前播放的歌词
                for (let i = 0; i < window.currentLyrics.length; i++) {
                    if (window.currentLyrics[i].time <= currentTime) {
                        currentLyric = window.currentLyrics[i].text;
                    } else {
                        break;
                    }
                }
            }
            
            return {
                songName: currentSong.name,
                artist: currentSong.artist,
                lyric: currentLyric,
                isListeningTogether: listenTogetherState.isListening,
                characterName: listenTogetherState.characterName
            };
        }
        
        // 页面加载时恢复状态（等待IndexedDB初始化完成）
        async function initListenTogetherState() {
            try {
                // 确保IndexedDB已初始化
                if (!db) {
                    await initDB();
                }
                // 加载所有角色的听歌时间
                await loadAllCharacterListenTimes();
                // 加载当前状态
                await loadListenTogetherState();
            } catch (e) {
                console.error('初始化一起听歌状态失败:', e);
            }
        }
        
        // 立即执行初始化
        initListenTogetherState();
        
        // 【关键】定期自动保存听歌时间（每10秒保存一次，防止数据丢失）
        let autoSaveTimeInterval = null;
        function startAutoSaveTime() {
            if (autoSaveTimeInterval) clearInterval(autoSaveTimeInterval);
            autoSaveTimeInterval = setInterval(() => {
                if (listenTogetherState.isListening && listenTogetherState.characterId) {
                    const listenedTime = Date.now() - listenTogetherState.startTime;
                    const totalTime = getTotalListenedTime(listenTogetherState.characterId) + listenedTime;
                    saveTotalListenedTimeAsync(listenTogetherState.characterId, totalTime);
                    console.log('【一起听歌】自动保存时间:', totalTime);
                }
            }, 10000); // 每10秒保存一次
        }
        function stopAutoSaveTime() {
            if (autoSaveTimeInterval) {
                clearInterval(autoSaveTimeInterval);
                autoSaveTimeInterval = null;
            }
        }
        
        // 【关键】页面卸载前保存听歌时间（使用同步方式）
        window.addEventListener('beforeunload', () => {
            if (listenTogetherState.isListening && listenTogetherState.characterId) {
                const listenedTime = Date.now() - listenTogetherState.startTime;
                const totalTime = getTotalListenedTime(listenTogetherState.characterId) + listenedTime;
                // 使用同步的 localStorage 作为备份（IndexedDB 是异步的，可能来不及保存）
                localStorage.setItem('listenTogether_backup_time', JSON.stringify({
                    characterId: listenTogetherState.characterId,
                    totalTime: totalTime,
                    timestamp: Date.now()
                }));
                // 同时尝试保存到 IndexedDB
                saveTotalListenedTimeAsync(listenTogetherState.characterId, totalTime);
                console.log('【一起听歌】页面卸载前保存时间:', totalTime);
            }
        });
        
        // 【关键】页面隐藏时保存听歌时间（适用于移动端切换应用）
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && listenTogetherState.isListening && listenTogetherState.characterId) {
                const listenedTime = Date.now() - listenTogetherState.startTime;
                const totalTime = getTotalListenedTime(listenTogetherState.characterId) + listenedTime;
                saveTotalListenedTimeAsync(listenTogetherState.characterId, totalTime);
                // 同时保存到 localStorage 备份
                localStorage.setItem('listenTogether_backup_time', JSON.stringify({
                    characterId: listenTogetherState.characterId,
                    totalTime: totalTime,
                    timestamp: Date.now()
                }));
                console.log('【一起听歌】页面隐藏时保存时间:', totalTime);
            }
        });
        
        // 【关键】页面加载时检查 localStorage 备份
        function loadBackupTime() {
            try {
                const backup = localStorage.getItem('listenTogether_backup_time');
                if (backup) {
                    const data = JSON.parse(backup);
                    // 检查备份是否在最近1小时内
                    if (Date.now() - data.timestamp < 3600000) {
                        console.log('【一起听歌】从备份恢复时间:', data);
                        // 更新缓存
                        characterListenTimeCache[data.characterId] = data.totalTime;
                        // 保存到 IndexedDB
                        saveTotalListenedTimeAsync(data.characterId, data.totalTime);
                    }
                    // 清除备份
                    localStorage.removeItem('listenTogether_backup_time');
                }
            } catch (e) {
                console.error('加载备份时间失败:', e);
            }
        }
        // 立即加载备份
        loadBackupTime();
        
        // 原生播放器错误回调
        function onNativeAudioError(error) {
            console.error('原生音频播放错误:', error);
            showToast('播放失败: ' + error);
            isPlaying = false;
            updatePlayerUI();
        }
        
        // ========== 一起听歌：定期发送音乐信息给父页面 ==========
        let musicInfoUpdateInterval = null;
        
        // 启动音乐信息更新
        function startMusicInfoUpdate() {
            // 停止之前的更新
            stopMusicInfoUpdate();
            
            // 立即发送一次
            sendMusicInfoToParent();
            
            // 每3秒发送一次更新
            musicInfoUpdateInterval = setInterval(() => {
                sendMusicInfoToParent();
            }, 3000);
        }
        
        // 停止音乐信息更新
        function stopMusicInfoUpdate() {
            if (musicInfoUpdateInterval) {
                clearInterval(musicInfoUpdateInterval);
                musicInfoUpdateInterval = null;
            }
        }
        
        // 发送音乐信息给父页面
        let lastSentLyric = '';
        
        function sendMusicInfoToParent() {
            if (!listenTogetherState.isListening || !listenTogetherState.characterId) {
                console.log('【一起听歌】未在听歌状态，不发送信息');
                return;
            }
            
            try {
                const currentSong = currentSongIndex >= 0 && currentSongs[currentSongIndex] 
                    ? currentSongs[currentSongIndex] 
                    : null;
                
                // 获取当前歌词（优先使用window.currentLineText，因为它在updateDesktopLyrics中被实时更新）
                let currentLyric = '';
                if (typeof window.currentLineText !== 'undefined' && window.currentLineText && window.currentLineText !== '暂无歌词') {
                    currentLyric = window.currentLineText;
                } else if (window.currentLyrics && window.currentLyrics.length > 0 && window.currentLyricIndex >= 0) {
                    const lyric = window.currentLyrics[window.currentLyricIndex];
                    currentLyric = lyric && lyric.text ? lyric.text : '';
                }
                
                const musicInfo = {
                    isListeningTogether: true,
                    characterId: listenTogetherState.characterId,
                    characterName: listenTogetherState.characterName,
                    songName: currentSong ? currentSong.name : '未知歌曲',
                    artist: currentSong ? currentSong.artist : '未知歌手',
                    lyric: currentLyric
                };
                
                console.log('【一起听歌】准备发送音乐信息:', musicInfo);
                
                // 发送给父页面
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({
                        type: 'musicInfoUpdate',
                        info: musicInfo
                    }, '*');
                    
                    // 如果歌词变化了，同时发送lyricsUpdate确保index.html中的缓存被更新
                    if (currentLyric !== lastSentLyric) {
                        lastSentLyric = currentLyric;
                        window.parent.postMessage({
                            type: 'lyricsUpdate',
                            lyricText: currentLyric
                        }, '*');
                        console.log('【一起听歌】歌词变化，发送lyricsUpdate:', currentLyric);
                    }
                    
                    console.log('【一起听歌】已发送音乐信息到父页面');
                } else {
                    console.log('【一起听歌】无法发送：window.parent不可用');
                }
            } catch (e) {
                console.error('【一起听歌】发送音乐信息失败:', e);
            }
        }
        
        // 随机播放
        function playRandom() {
            if (currentSongs.length === 0) return;
            const randomIndex = Math.floor(Math.random() * currentSongs.length);
            playSong(randomIndex);
        }
        
        // 全局调试数据
        window.debugCallbackStats = {
            progressCount: 0,
            lastPosition: 0,
            lastDuration: 0,
            lastCallbackTime: 0,
            startTime: Date.now(),
            jsFunctionType: '未知',
            androidLogs: []
        };
        
        // 添加Android日志到调试数据
        function addAndroidLog(message) {
            if (!window.debugCallbackStats.androidLogs) {
                window.debugCallbackStats.androidLogs = [];
            }
            const time = new Date().toLocaleTimeString();
            window.debugCallbackStats.androidLogs.push(`[${time}] ${message}`);
            // 只保留最近20条日志
            if (window.debugCallbackStats.androidLogs.length > 20) {
                window.debugCallbackStats.androidLogs.shift();
            }
        }
        
        // 显示调试信息弹窗
        function showDebugInfo() {
            const isApp = isAndroidApp();
            const audio = document.getElementById('audioPlayer');
            const currentSong = currentSongIndex >= 0 && currentSongs[currentSongIndex] ? currentSongs[currentSongIndex] : null;
            
            // 计算回调频率
            const elapsed = (Date.now() - window.debugCallbackStats.startTime) / 1000;
            const callbackRate = elapsed > 0 ? (window.debugCallbackStats.progressCount / elapsed).toFixed(2) : 0;
            
            const info = {
                '环境信息': '',
                '是否为APP环境': isApp ? '是' : '否',
                'AndroidShell': typeof AndroidShell !== 'undefined' ? '存在' : '不存在',
                'playAudio': isApp && AndroidShell.playAudio ? '✓' : '✗',
                '': '',
                '播放状态': '',
                '当前播放': currentSong ? currentSong.name : '无',
                '歌手': currentSong ? currentSong.artist : '-',
                '播放状态': isPlaying ? '播放中' : '已暂停',
                '当前索引': currentSongIndex,
                ' ': '',
                '回调统计': '',
                '回调次数': window.debugCallbackStats.progressCount,
                '运行时间': elapsed.toFixed(1) + '秒',
                '回调频率': callbackRate + '次/秒',
                '最后位置': window.debugCallbackStats.lastPosition + 'ms',
                '最后时长': window.debugCallbackStats.lastDuration + 'ms',
                'JS函数类型': window.debugCallbackStats.jsFunctionType,
                '  ': '',
                'HTML5 Audio': '',
                'Audio当前时间': audio ? audio.currentTime.toFixed(2) + 's' : 'N/A',
                'Audio总时长': audio && audio.duration ? audio.duration.toFixed(2) + 's' : 'N/A',
                '歌词状态': window.currentLyrics ? `已加载(${window.currentLyrics.length}行)` : '未加载'
            };
            
            let html = '<div style="text-align:left;font-size:13px;line-height:1.6;">';
            for (const [key, value] of Object.entries(info)) {
                if (value === '') {
                    html += `<div style="margin-top:12px;font-weight:bold;color:#6B5344;border-bottom:1px solid rgba(210,180,140,0.3);padding-bottom:4px;">${key}</div>`;
                } else {
                    const color = value === '✓' || value === '是' || value === '存在' || value === '播放中' ? '#27ae60' : 
                                  value === '✗' || value === '否' || value === '不存在' ? '#e74c3c' : '#5C4A3A';
                    html += `<div style="display:flex;justify-content:space-between;padding:2px 0;"><span style="color:#8B7355">${key}</span><span style="color:${color};font-weight:500">${value}</span></div>`;
                }
            }
            html += '</div>';
            
            // 创建弹窗
            const overlay = document.createElement('div');
            overlay.className = 'debug-overlay';
            overlay.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0,0,0,0.7);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 999999;
                padding: 20px;
            `;
            
            const dialog = document.createElement('div');
            dialog.style.cssText = `
                background: linear-gradient(135deg, #FFFEF0 0%, #FFF8DC 100%);
                border-radius: 16px;
                padding: 20px;
                width: 90%;
                max-width: 360px;
                max-height: 80vh;
                overflow-y: auto;
                border: 2px solid rgba(210, 180, 140, 0.3);
            `;
            // 构建Android日志HTML
            let logsHtml = '';
            if (window.debugCallbackStats.androidLogs && window.debugCallbackStats.androidLogs.length > 0) {
                logsHtml = `
                    <div style="margin-top:16px;">
                        <div style="font-weight:bold;color:#6B5344;border-bottom:1px solid rgba(210,180,140,0.3);padding-bottom:4px;margin-bottom:8px;">Android日志</div>
                        <div style="max-height:120px;overflow-y:auto;background:rgba(0,0,0,0.05);border-radius:8px;padding:8px;font-size:11px;line-height:1.5;">
                            ${window.debugCallbackStats.androidLogs.map(log => `<div style="color:#5C4A3A;">${log}</div>`).join('')}
                        </div>
                    </div>
                `;
            }
            
            dialog.innerHTML = `
                <h3 style="margin:0 0 16px 0;color:#6B5344;text-align:center;font-size:18px;">调试信息</h3>
                ${html}
                ${logsHtml}
                <div style="display:flex;gap:10px;margin-top:16px;">
                    <button onclick="this.closest('.debug-overlay').remove()" style="
                        flex:1;
                        padding: 12px;
                        background: linear-gradient(135deg, #D4A574 0%, #C49A6C 100%);
                        border: none;
                        border-radius: 8px;
                        color: white;
                        font-size: 14px;
                        cursor: pointer;
                    ">关闭</button>
                    <button onclick="window.debugCallbackStats={progressCount:0,lastPosition:0,lastDuration:0,lastCallbackTime:0,startTime:Date.now(),jsFunctionType:'未知',androidLogs:[]};showToast('统计已重置');" style="
                        flex:1;
                        padding: 12px;
                        background: rgba(210,180,140,0.3);
                        border: none;
                        border-radius: 8px;
                        color: #6B5344;
                        font-size: 14px;
                        cursor: pointer;
                    ">重置统计</button>
                </div>
            `;
            
            overlay.appendChild(dialog);
            document.body.appendChild(overlay);
        }
        
        // 更新调试统计（在onNativeAudioProgress中调用）
        function updateDebugStats(position, duration) {
            window.debugCallbackStats.progressCount++;
            window.debugCallbackStats.lastPosition = position;
            window.debugCallbackStats.lastDuration = duration;
            window.debugCallbackStats.lastCallbackTime = Date.now();
        }
        
        // ==================== 轮播图管理功能（提前定义）====================
        let carouselData = JSON.parse(localStorage.getItem('musicCarouselData') || '[]');
        
        // 显示轮播图选项弹窗
        function showCarouselOptions() {
            const modal = document.getElementById('carouselModal');
            if (modal) {
                modal.style.display = 'flex';
                updateCarouselList();
            }
        }
        
        // 关闭轮播图弹窗
        function closeCarouselModal() {
            const modal = document.getElementById('carouselModal');
            if (modal) {
                modal.style.display = 'none';
            }
        }
        
        // 添加图片
        function addCarouselImage() {
            const input = document.getElementById('carouselImageInput');
            if (input) input.click();
        }
        
        // 添加视频
        function addCarouselVideo() {
            const input = document.getElementById('carouselVideoInput');
            if (input) input.click();
        }
        
        // 处理图片选择
        async function handleCarouselImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = async function(e) {
                carouselData.push({
                    type: 'image',
                    src: e.target.result,
                    name: file.name
                });
                await saveCarouselData();
                renderCarousel();
                updateCarouselList();
                showToast('图片添加成功');
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }
        
        // 处理视频选择
        async function handleCarouselVideoSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = async function(e) {
                carouselData.push({
                    type: 'video',
                    src: e.target.result,
                    name: file.name
                });
                await saveCarouselData();
                renderCarousel();
                updateCarouselList();
                showToast('视频添加成功');
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }
        
        // 删除轮播项
        async function deleteCarouselItem(index) {
            carouselData.splice(index, 1);
            await saveCarouselData();
            renderCarousel();
            updateCarouselList();
            if (currentSlide >= carouselData.length) {
                currentSlide = Math.max(0, carouselData.length - 1);
            }
            updateCarouselPosition();
        }
        
        // 清空全部
        async function clearCarousel() {
            if (confirm('确定要清空所有轮播内容吗？')) {
                carouselData = [];
                await saveCarouselData();
                renderCarousel();
                updateCarouselList();
                currentSlide = 0;
                showToast('已清空全部内容');
            }
        }
        
        // 保存轮播数据到 IndexedDB
        async function saveCarouselData() {
            try {
                await saveToDB('carousel', 'main', carouselData);
                console.log('轮播图数据已保存到 IndexedDB');
            } catch (error) {
                console.error('保存轮播图数据失败:', error);
                // 降级到 localStorage
                localStorage.setItem('musicCarouselData', JSON.stringify(carouselData));
            }
        }
        
        // 渲染轮播图
        function renderCarousel() {
            const slidesContainer = document.getElementById('carouselSlides');
            const dotsContainer = document.getElementById('carouselDots');
            
            if (!slidesContainer) return;
            
            if (carouselData.length === 0) {
                slidesContainer.innerHTML = `
                    <div class="carousel-slide" data-type="placeholder">
                        <div class="carousel-placeholder" onclick="showCarouselOptions()">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
                                <rect x="3" y="3" width="18" height="18" rx="2"/>
                                <circle cx="8.5" cy="8.5" r="1.5"/>
                                <path d="M21 15l-5-5L5 21"/>
                            </svg>
                            <span>点击添加图片或视频</span>
                        </div>
                    </div>
                `;
                if (dotsContainer) dotsContainer.innerHTML = '<div class="carousel-dot active"></div>';
                return;
            }
            
            slidesContainer.innerHTML = carouselData.map((item, index) => {
                if (item.type === 'image') {
                    return `<div class="carousel-slide" data-type="image" data-index="${index}">
                        <img src="${item.src}" alt="${item.name}">
                    </div>`;
                } else if (item.type === 'video') {
                    return `<div class="carousel-slide" data-type="video" data-index="${index}">
                        <video src="${item.src}" autoplay muted loop playsinline></video>
                    </div>`;
                }
            }).join('');
            
            if (dotsContainer) {
                dotsContainer.innerHTML = carouselData.map((_, index) => 
                    `<div class="carousel-dot ${index === currentSlide ? 'active' : ''}" onclick="goToSlide(${index})"></div>`
                ).join('');
            }
            
            updateCarouselPosition();
        }
        
        // 更新轮播图位置
        function updateCarouselPosition() {
            const slides = document.getElementById('carouselSlides');
            if (slides) {
                slides.style.transform = `translateX(-${currentSlide * 100}%)`;
            }
            document.querySelectorAll('.carousel-dot').forEach((dot, index) => {
                dot.classList.toggle('active', index === currentSlide);
            });
        }
        
        // 更新轮播列表（弹窗中显示）
        function updateCarouselList() {
            const listContainer = document.getElementById('carouselList');
            if (!listContainer) return;
            
            if (carouselData.length === 0) {
                listContainer.innerHTML = '<div style="text-align: center; color: #999; padding: 20px;">暂无内容，请添加图片或视频</div>';
                return;
            }
            
            listContainer.innerHTML = carouselData.map((item, index) => {
                const thumbnail = item.type === 'image' 
                    ? `<img src="${item.src}" alt="">`
                    : `<video src="${item.src}"></video>`;
                const typeLabel = item.type === 'image' ? '图片' : '视频';
                
                return `
                    <div class="carousel-list-item">
                        ${thumbnail}
                        <div class="carousel-list-item-info">
                            <div>${typeLabel}</div>
                            <div style="font-size: 12px; color: #999; margin-top: 4px;">${item.name}</div>
                        </div>
                        <button class="carousel-list-item-delete" onclick="deleteCarouselItem(${index})">×</button>
                    </div>
                `;
            }).join('');
        }
        
        // ==================== 搜索相关函数（提前定义）====================
        function handleSearchKeypress(event) {
            if (event.key === 'Enter') {
                searchMusic();
            }
        }
        
        // 占位符函数 - 将在后面重新定义
        function searchMusic() { console.log('searchMusic not loaded yet'); }
        function showPlaylistManager() { console.log('showPlaylistManager not loaded yet'); }
        function switchPlaylist(id) { console.log('switchPlaylist not loaded yet'); }
        function togglePlay() { console.log('togglePlay not loaded yet'); }
        function playPrev() { console.log('playPrev not loaded yet'); }
        function playNext() { console.log('playNext not loaded yet'); }
        function togglePlayMode() { console.log('togglePlayMode not loaded yet'); }
        function openFullscreenPlayer() { console.log('openFullscreenPlayer not loaded yet'); }
        function closeFullscreenPlayer() { console.log('closeFullscreenPlayer not loaded yet'); }
        function seekTo(event) { console.log('seekTo not loaded yet'); }
        function togglePlaylist() { console.log('togglePlaylist not loaded yet'); }
        function toggleDesktopLyrics() { console.log('toggleDesktopLyrics not loaded yet'); }
        function showCreatePlaylistModal() { console.log('showCreatePlaylistModal not loaded yet'); }
        function hideCreatePlaylistModal() { console.log('hideCreatePlaylistModal not loaded yet'); }
        function createPlaylist() { console.log('createPlaylist not loaded yet'); }
        function closeModal(event) { console.log('closeModal not loaded yet'); }
        function addToPlaylist(index) { console.log('addToPlaylist not loaded yet'); }
        function quickSearch(keyword) { console.log('quickSearch not loaded yet'); }
        function clearSearchHistory() { console.log('clearSearchHistory not loaded yet'); }
        function prevSlide() { console.log('prevSlide not loaded yet'); }
        function nextSlide() { console.log('nextSlide not loaded yet'); }
        function goToSlide(index) { console.log('goToSlide not loaded yet'); }
        function playSong(index) { console.log('playSong not loaded yet'); }
    </script>
</head>
<body>
    <!-- 状态栏占位 -->
    <div class="status-bar-placeholder"></div>
    
    <!-- 顶部导航 -->
    <div class="header">
        <div class="header-top">
            <!-- 返回按钮已移到iframe外部 -->
            <div style="width: 36px;"></div>
            <div class="header-title">音乐</div>
